# ---
# # Multi-arch image build & push to GHCR.
# #
# # This is the only workflow that holds a writable token, and it is deliberately
# # unreachable from pull requests: it triggers on pushes to main and on version
# # tags only. Fork PRs therefore can never obtain `packages: write`.
# #
# # Where the build actually happens:
# #   steps run DIRECTLY in the ephemeral runner pod (no `container:`), because the
# #   rootless buildkitd sidecar of that pod is reachable on tcp://127.0.0.1:1234
# #   (BUILDKIT_HOST is pre-set by the scale set values). buildx is used in
# #   "remote driver" mode, so there is no Docker daemon, no docker.sock and no
# #   privileged container anywhere in the chain.
# #
# # arm64 layers are produced by QEMU emulation; the binfmt handlers are registered
# # on each node by the DaemonSet in
# # infrastructure/actions-runner-controller/binfmt-daemonset.yaml.
# name: build-images

