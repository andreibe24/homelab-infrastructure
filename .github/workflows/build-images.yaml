#     # filters for tag pushes too, which would silently skip release builds
#     # whose tagged commit does not itself touch src/webapp/** (e.g. a tag cut
#     # from a commit that only bumped a changelog). Path-scoping for the
#     # common case (plain pushes to main / PRs) is instead done by the
#     # `changes` gate job below, which is skipped entirely for tag refs.
#   workflow_dispatch:

