name: Build and push forum images

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - src/webapp-django-vite/**
      - .github/workflows/docker-build-push.yaml
  push:
    branches: [main]
    paths:
      - src/webapp-django-vite/**

permissions:
  contents: read
  packages: write

concurrency:
  group: forum-images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'stable' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select image tags
        id: tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === "pull_request") {
              core.setOutput("value", `pr-${context.payload.pull_request.number}`);
              return;
            }

            const { execFileSync } = require("node:child_process");
            const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
            const prefix = "webapp-django-vite-";
            const pattern = /^webapp-django-vite-(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            const tags = git("tag", "--merged", context.sha, "--sort=-version:refname")
              .split("\n").filter(tag => pattern.test(tag));
            const latest = tags[0];
            if (latest && git("rev-list", "-n", "1", latest) === context.sha) {
              core.setOutput("value", latest.slice(prefix.length));
              core.setOutput("release", latest);
              return;
            }

            // Migrate from the existing numeric 1.0.0 images without downgrading.
            const version = latest
              ? pattern.exec(latest).slice(1).map(Number)
              : [1, 0, 0];
            const legacy = git("tag", "--merged", context.sha, "--list", "v1.0.0");
            const baseline = latest || legacy;
            const range = baseline ? `${baseline}..${context.sha}` : context.sha;
            const commits = git("log", "--format=%B%x00", range, "--", "src/webapp-django-vite/")
              .split("\0").map(message => message.trim()).filter(Boolean);
            const breaking = commits.some(message =>
              /^[a-z]+(?:\([^)]+\))?!: /m.test(message) ||
              /^BREAKING[ -]CHANGE: /m.test(message));
            const feature = commits.some(message => /^feat(?:\([^)]+\))?: /m.test(message));
            if (breaking) {
              version[0] += 1; version[1] = 0; version[2] = 0;
            } else if (feature) {
              version[1] += 1; version[2] = 0;
            } else {
              version[2] += 1;
            }
            core.setOutput("value", version.join("."));
            core.setOutput("release", `${prefix}${version.join(".")}`);

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./src/webapp-django-vite
          push: true
          set: |
            backend.cache-from=type=gha,scope=chat-backend
            backend.cache-to=type=gha,mode=max,scope=chat-backend
            frontend.cache-from=type=gha,scope=chat-frontend
            frontend.cache-to=type=gha,mode=max,scope=chat-frontend
        env:
          TAGS: ${{ steps.tags.outputs.value }}
          REGISTRY: ghcr.io/${{ github.repository }}

      - name: Create app release after publishing images
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release }}
          IMAGE_TAG: ${{ steps.tags.outputs.value }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag,
              });
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body: `Images published with tag \`${process.env.IMAGE_TAG}\` from commit ${context.sha}.`,
              draft: false,
              prerelease: false,
            });
