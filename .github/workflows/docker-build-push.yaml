name: Build and push chat images

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - src/webapp-django-vite/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select image tags
        id: tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        with:
          script: |
            if (context.eventName === "pull_request") {
              core.setOutput("value", "dev");
              return;
            }

            const tag = context.eventName === "release"
              ? context.payload.release.tag_name
              : process.env.DISPATCH_TAG;
            const match = /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag ?? "");
            if (!match) {
              core.setFailed(`Release tag must be semantic version X.Y.Z or vX.Y.Z; received "${tag}".`);
              return;
            }
            const version = `${match[1]}.${match[2]}.${match[3]}`;
            core.setOutput("value", `${version},dev-${version}`);

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        working-directory: src/webapp-django-vite
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.value }}
          REGISTRY: ghcr.io/${{ github.repository }}
        run: TAGS="$IMAGE_TAGS" docker buildx bake --push
