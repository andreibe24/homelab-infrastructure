---
# Static analysis for the whole monorepo: Kubernetes manifests, the Django
# backend and the Vite frontend.
#
# Runs on the in-cluster ARC scale set (see
# infrastructure/controllers/actions-runner-controller/README.md).
#
# Security notes:
#   * `permissions: contents: read` -- this workflow's GITHUB_TOKEN cannot write
#     anything, and no `secrets.*` are referenced, so nothing valuable is ever
#     placed in the runner pod's environment;
#   * every job refuses to run for pull requests coming from a fork, so untrusted
#     code never executes on a self-hosted runner;
#   * job containers are glibc-based on purpose: ARC's kubernetes container hooks
#     inject the runner's own Node binary into the job pod, which musl images
#     (alpine) cannot execute.
name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: kubernetes manifests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, homelab-runners]
    container:
      image: python:3.13-slim
    env:
      # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
      KUSTOMIZE_VERSION: "5.7.1"
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: "0.7.0"
    steps:
      - name: Install tooling
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git tar
          rm -rf /var/lib/apt/lists/*
          pip install --no-cache-dir yamllint==1.37.1
          kustomize_url="https://github.com/kubernetes-sigs/kustomize/releases/download"
          kustomize_url="${kustomize_url}/kustomize%2Fv${KUSTOMIZE_VERSION}"
          kustomize_url="${kustomize_url}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "${kustomize_url}" | tar -xz -C /usr/local/bin kustomize
          kubeconform_url="https://github.com/yannh/kubeconform/releases/download"
          kubeconform_url="${kubeconform_url}/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "${kubeconform_url}" | tar -xz -C /usr/local/bin kubeconform

      - uses: actions/checkout@v7

      - name: yamllint
        run: |
          yamllint -f github \
            -d "{extends: relaxed, rules: {line-length: {max: 200, level: warning}, trailing-spaces: enable}}" \
            .github apps clusters infrastructure

      - name: kustomize build (every overlay must render)
        run: |
          set -euo pipefail
          mkdir -p .ci-rendered
          find apps clusters infrastructure -name kustomization.yaml -printf '%h\n' | sort -u | while read -r dir; do
            echo "::group::kustomize build ${dir}"
            kustomize build "${dir}" > ".ci-rendered/$(echo "${dir}" | tr '/' '_').yaml"
            echo "::endgroup::"
          done

      - name: kubeconform (CRDs are allowed to be unknown)
        run: |
          set -euo pipefail
          cat .ci-rendered/*.yaml | kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.31.0 \
            -schema-location default \
            -

  backend:
    name: python / django (ruff)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, homelab-runners]
    container:
      image: python:3.13-slim
    steps:
      - uses: actions/checkout@v7

      # src/webapp/ is created by topic 4 (cd-webapp); until then this job is a
      # no-op instead of a red X.
      - name: Detect backend source
        id: detect
        run: |
          if [ -d src/webapp/backend ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/webapp/backend does not exist yet - skipping"
          fi

      - name: Install ruff
        if: steps.detect.outputs.present == 'true'
        # renovate: datasource=pypi depName=ruff
        run: pip install --no-cache-dir "ruff==0.14.2"

      - name: ruff check
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/backend
        run: ruff check --output-format=github .

      - name: ruff format --check
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/backend
        run: ruff format --check --diff .

      - name: django deployment checks
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-only-value-not-a-real-secret
          DJANGO_DEBUG: "0"
        run: |
          pip install --no-cache-dir -r requirements.txt
          python manage.py check --deploy --fail-level ERROR

  frontend:
    name: typescript / vite (eslint + tsc)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, homelab-runners]
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v7

      - name: Detect frontend source
        id: detect
        run: |
          if [ -f src/webapp/frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/webapp/frontend does not exist yet - skipping"
          fi

      - name: npm ci
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/frontend
        run: npm ci --no-audit --no-fund

      - name: eslint
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/frontend
        run: npm run lint

      - name: tsc --noEmit
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/frontend
        run: npx --no-install tsc --noEmit
