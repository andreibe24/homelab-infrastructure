name: Release chat app

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]

permissions:
  contents: write
  actions: write

concurrency:
  group: chat-app-release
  cancel-in-progress: false

jobs:
  validate-title:
    if: >-
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Require a Conventional Commit PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (!/^[a-z]+(\([^)]+\))?!?: .+$/.test(title)) {
              core.setFailed(
                "Use a Conventional Commit PR title, such as 'feat!: init source code'.",
              );
            }

  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    needs: validate-title
    runs-on: ubuntu-latest
    steps:
      - name: Find an existing release for this pull request
        id: existing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = `<!-- chat-app-pr:${context.payload.pull_request.number} -->`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((release) => release.body?.includes(marker));
            if (existing) {
              core.setOutput("tag", existing.tag_name);
            }

      - name: Seed the initial semver baseline
        if: steps.existing.outputs.tag == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v0.0.0",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "refs/tags/v0.0.0",
                sha: context.payload.pull_request.base.sha,
              });
            }

      - name: Calculate the next semver from the PR title
        id: semver
        if: steps.existing.outputs.tag == ''
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          additionalCommits: ${{ github.event.pull_request.title }}
          fallbackTag: v0.0.0
          skipInvalidTags: true
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

      - name: Create GitHub release
        if: steps.existing.outputs.tag == '' && steps.semver.outputs.bump != 'none'
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.semver.outputs.next }}
        with:
          script: |
            const response = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.payload.pull_request.merge_commit_sha,
              name: process.env.RELEASE_TAG,
              body: `Release from PR #${context.payload.pull_request.number}: ${context.payload.pull_request.title}\n\n<!-- chat-app-pr:${context.payload.pull_request.number} -->`,
              draft: false,
              prerelease: false,
            });
            core.setOutput("tag", response.data.tag_name);

      - name: Trigger image publishing for the release
        if: steps.existing.outputs.tag != '' || steps.semver.outputs.bump != 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.existing.outputs.tag || steps.create-release.outputs.tag }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "docker-build-push.yaml",
              ref: "main",
              inputs: { tag: process.env.RELEASE_TAG },
            });
