name: Renovate

on:
  schedule:
    - cron: "13 1-23/2 * * *"          # At minute 13 past every 2nd hour from 1 through 23
  ## External workflow dispatchers simulate cron behavior on this github repo
  # Docs: ./external-workflow-dispatchers/README.md
  # 1. Gitlab -> https://gitlab.com/andreibe24/homelab-infrastructure 
  # cron: "33 1-23/2 * * *"
  # 2. Cloudflare worker -> ./docs/external-workflow-dispatchers/cloudflare/
  # cron: "43 1-23/2 * * *"   
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    if: >-
      github.repository == 'andreibe24/homelab-infrastructure' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Renovate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: andreibe24
          repositories: homelab-infrastructure

      - name: Run Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
