---
# Unit / integration tests for the webapp: pytest (Django + aioquic HTTP/3 smoke
# test) and vitest (Vite frontend).
#
# Same hardening as lint.yaml: read-only GITHUB_TOKEN, no `secrets.*`, fork PRs
# are refused so untrusted code never runs on the self-hosted pool.
name: test

on:
  push:
    branches: [main]
    paths:
      - "src/webapp/**"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [main]
    paths:
      - "src/webapp/**"
      - ".github/workflows/test.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest (django + http/3)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, homelab-runners]
    container:
      image: python:3.13-slim
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-value-not-a-real-secret
      DJANGO_DEBUG: "0"
      # Tests run against SQLite so the job needs no database service and no
      # credentials at all.
      DATABASE_URL: sqlite:///ci.sqlite3
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Detect backend source
        id: detect
        run: |
          if [ -f src/webapp/backend/manage.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/webapp/backend does not exist yet - skipping"
          fi

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/backend
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends build-essential
          rm -rf /var/lib/apt/lists/*
          pip install --no-cache-dir -r requirements.txt
          # Test-only dependencies; keep them out of the runtime image.
          pip install --no-cache-dir -r requirements-dev.txt || \
            pip install --no-cache-dir pytest pytest-django pytest-asyncio pytest-cov

      - name: pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/backend
        # The HTTP/3 smoke test (Hypercorn + aioquic over UDP) lives next to the
        # unit tests and only talks to 127.0.0.1 inside this pod, which is exactly
        # what the egress-only NetworkPolicy allows.
        run: |
          pytest -q \
            --junitxml=../../../pytest-report.xml \
            --cov=. --cov-report=term-missing

      - name: Upload test report
        if: steps.detect.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: vitest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, homelab-runners]
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v7

      - name: Detect frontend source
        id: detect
        run: |
          if [ -f src/webapp/frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/webapp/frontend does not exist yet - skipping"
          fi

      - name: npm ci
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/frontend
        run: npm ci --no-audit --no-fund

      - name: vitest
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/frontend
        run: npx --no-install vitest run --reporter=default --reporter=junit --outputFile=../../../vitest-report.xml

      - name: Build (production bundle must compile)
        if: steps.detect.outputs.present == 'true'
        working-directory: src/webapp/frontend
        run: npm run build

      - name: Upload test report
        if: steps.detect.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: vitest-report.xml
          if-no-files-found: ignore
          retention-days: 7
