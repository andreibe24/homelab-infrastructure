# TLS material.
#
# QUIC has no plaintext mode: TLS 1.3 is part of the protocol, so the backend needs
# a real certificate even inside the homelab. Both certificates are issued by the
# cert-manager ClusterIssuer created by topic 2 (linkerd-mtls); that topic owns the
# PKI, this topic only consumes it.
#
# CONTRACT WITH TOPIC 2: `issuerRef.name` below must match the ClusterIssuer topic 2
# creates in infrastructure/configs/. `homelab-ca` is the assumed name -- if topic 2
# names it differently (or uses an ACME/DNS-01 issuer for a public domain), change
# the two issuerRefs here and nothing else.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webapp-backend-tls
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
spec:
  secretName: webapp-backend-tls
  secretTemplate:
    labels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/component: backend
  # 90 days with renewal at 2/3 lifetime; Hypercorn re-reads the files on restart,
  # so cert-manager's rotation is paired with a rollout (see README.md).
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    # The HTTP/3 origin: an `alt-svc` alternative must serve a cert valid for the
    # origin authority, so this name is what browsers verify on the QUIC handshake.
    - api.webapp.homelab.lan
    # In-cluster names, for the TLS fallback port when called east-west.
    - webapp-backend
    - webapp-backend.webapp.svc
    - webapp-backend.webapp.svc.cluster.local
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webapp-frontend-tls
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: frontend
spec:
  # Consumed by ingress.yaml (`tls.secretName`), not mounted into a pod.
  secretName: webapp-frontend-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - webapp.homelab.lan
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
