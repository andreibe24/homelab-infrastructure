# Non-secret configuration for the webapp. Secrets (DJANGO_SECRET_KEY, any DB URL)
# come from the Secret `webapp-backend-secrets`, which is produced by the repo-wide
# secret mechanism owned by topic 3 (SOPS or SealedSecrets) -- never commit them here.
# The Deployment references that Secret with `optional: true`, so the app still boots
# (with an ephemeral SECRET_KEY) before topic 3 lands.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-backend-env
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
data:
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_DEBUG: "false"
  DJANGO_LOG_LEVEL: INFO
  # The SPA host, the HTTP/3 API host and the in-cluster Service name.
  DJANGO_ALLOWED_HOSTS: "webapp.homelab.lan,api.webapp.homelab.lan,webapp-backend,webapp-backend.webapp.svc.cluster.local,localhost,127.0.0.1"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://webapp.homelab.lan,https://api.webapp.homelab.lan"
  # The SPA talks to a different origin when it uses the HTTP/3 endpoint directly.
  DJANGO_CORS_ALLOWED_ORIGINS: "https://webapp.homelab.lan"
  # Advertised to browsers on every response. ":443" is the *LoadBalancer* UDP port
  # (Service/webapp-backend-quic), not the container port 8443 -- see README.md.
  HTTP3_ALT_SVC: 'h3=":443"; ma=86400'
  # Paths inside the cert-manager Secret mount (certificate.yaml).
  TLS_CERTFILE: /etc/webapp/tls/tls.crt
  TLS_KEYFILE: /etc/webapp/tls/tls.key
  # SANs for the emergency self-signed cert the entrypoint generates if the
  # cert-manager Secret is not present yet.
  SELF_SIGNED_HOSTS: "api.webapp.homelab.lan webapp-backend.webapp.svc.cluster.local localhost"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-frontend-env
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: frontend
data:
  # Substituted into /etc/nginx/templates/default.conf.template by the nginx
  # entrypoint's envsubst step.
  BACKEND_HOST: webapp-backend.webapp.svc.cluster.local
  BACKEND_PORT: "8000"
  ALT_SVC: 'h3=":443"; ma=86400'
  SPA_API_ORIGIN: "https://api.webapp.homelab.lan"
  NGINX_ENVSUBST_FILTER: "^(BACKEND_|ALT_SVC|SPA_)"
  NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
