# nginx server block for the frontend pod.
#
# Mounted read-only at /etc/nginx/templates/default.conf.template and rendered by
# the official nginx entrypoint (envsubst) into /etc/nginx/conf.d/default.conf,
# which is a writable emptyDir. Variables come from ConfigMap/webapp-frontend-env.
#
# Keep in sync with src/webapp/frontend/nginx.conf.template (the copy baked into
# the image as a standalone-run default). This ConfigMap wins in-cluster.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-nginx-config
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: frontend
data:
  default.conf.template: |
    server {
        listen       8080;
        listen       [::]:8080;
        http2        on;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        gzip              on;
        gzip_vary         on;
        gzip_comp_level   6;
        gzip_min_length   1024;
        gzip_proxied      any;
        gzip_types        text/plain text/css text/javascript application/javascript
                          application/json application/xml image/svg+xml application/wasm;

        # HTTP/3 advertisement. ingress-nginx in front of this pod terminates TLS
        # over TCP only; the h3 alternative is the backend's own QUIC listener,
        # published on UDP/443 by Service/webapp-backend-quic.
        add_header Alt-Svc "${ALT_SVC}" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Same-origin API fallback over plain TCP; Linkerd adds mTLS on this hop.
        location /api/ {
            proxy_pass              http://${BACKEND_HOST}:${BACKEND_PORT};
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_connect_timeout   5s;
            proxy_read_timeout      30s;
            proxy_buffering         off;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
