# North-south entry point for the SPA (and the TCP-only API fallback).
#
# DECISION: plain `Ingress` + ingress-nginx, NOT Gateway API.
#   * ingress-nginx is the only north-south implementation declared in
#     infrastructure/sources/helm-repositories.yaml; no Gateway API controller is
#     installed by any topic, so an `HTTPRoute` would be inert.
#   * Neither object helps with HTTP/3 anyway: `Ingress` has no UDP concept, and a
#     Gateway API `Listener` with `protocol: UDP` requires an implementation that
#     actually terminates QUIC. The QUIC datapath therefore bypasses this Ingress
#     entirely (Service/webapp-backend-quic, LoadBalancer UDP/443).
# The equivalent HTTPRoute is sketched in README.md for whoever adds a Gateway later.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  labels:
    app.kubernetes.io/name: webapp
  annotations:
    # cert-manager issues/renews the Secret referenced under `tls:` below; the
    # Certificate object is declared explicitly in certificate.yaml, so this
    # annotation is intentionally omitted to avoid two owners of the same Secret.
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Advertise the HTTP/3 endpoint on responses that ingress-nginx generates, so
    # the upgrade hint survives even for responses the SPA pod does not produce.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Alt-Svc: h3=\":443\"; ma=86400";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webapp.homelab.lan
      secretName: webapp-frontend-tls
  rules:
    - host: webapp.homelab.lan
      http:
        paths:
          # TCP-only fallback for the API on the SPA's own origin. Browsers that
          # cannot reach UDP/443 keep working through this path (HTTP/1.1 or h2).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: webapp-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-frontend
                port:
                  name: http
