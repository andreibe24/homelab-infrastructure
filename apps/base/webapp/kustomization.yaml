# Environment-agnostic base for the demo webapp (topic 4 -- cd-webapp).
#
# Consumed by apps/homelab/, which patches replicas/resources/image tags and adds
# the Flux image-automation CRs. Nothing here is cluster-specific except the
# placeholder hostnames, which the overlay may patch.
#
# The `webapp` Namespace is NOT declared here: it is owned by
# infrastructure/namespaces/namespaces.yaml (topic 1) and already carries
# `linkerd.io/inject: enabled`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp

resources:
  - configmap-app.yaml
  - configmap-nginx.yaml
  - deployment-backend.yaml
  - deployment-frontend.yaml
  - service-backend.yaml
  - service-frontend.yaml
  - certificate.yaml
  - ingress.yaml
  # Secrets (DJANGO_SECRET_KEY, ...) are added by topic 3's repo-wide mechanism as
  # `webapp-backend-secrets`; the backend Deployment consumes it with
  # `optional: true` so this base stays deployable on its own.
  # - secret.sops.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: flux
