# Backend Services.
#
# WHY THREE SERVICES
#
# 1. `webapp-backend` (ClusterIP)      east-west traffic: the nginx frontend's /api
#                                      proxy, kubelet-independent clients and topic
#                                      5's ServiceMonitor scraping /metrics. TCP only.
# 2. `webapp-backend-tls` (LB, TCP)    north-south TLS fallback for clients that
#                                      cannot use QUIC; also the connection that
#                                      carries the `alt-svc` advertisement.
# 3. `webapp-backend-quic` (LB, UDP)   the HTTP/3 datapath.
#
# A single Service *can* list TCP and UDP ports (MixedProtocolLBService is GA since
# k8s 1.26), but many LoadBalancer implementations -- MetalLB in L2 mode included --
# behave more predictably with one protocol per Service. They are therefore split
# and pinned onto ONE shared address via MetalLB's `allow-shared-ip` annotation, so
# both are reachable as `:443` on the same hostname. That is required: an `alt-svc`
# alternative must be reachable on the advertised authority and must present a
# certificate valid for the origin host.
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
  ports:
    # Plaintext, in-mesh (Linkerd mTLS). Also the /metrics target: topic 5's
    # ServiceMonitor selects these labels and this port name.
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    # In-cluster TLS fallback, mesh-skipped end-to-end TLS.
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend-tls
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: webapp-edge
  annotations:
    # MetalLB: share one IP with the QUIC Service below so TCP/443 and UDP/443
    # answer on the same address (and therefore the same DNS name).
    metallb.universe.tf/allow-shared-ip: webapp-api
    # `loadBalancerIP` / MetalLB address-pool selection is cluster-specific and is
    # patched in apps/homelab/.
spec:
  type: LoadBalancer
  # Preserve the client source IP; also keeps QUIC connection migration sane.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend-quic
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: webapp-edge
  annotations:
    metallb.universe.tf/allow-shared-ip: webapp-api
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/component: backend
  ports:
    # HTTP/3. This never traverses ingress-nginx -- see README.md.
    - name: quic
      port: 443
      targetPort: quic
      protocol: UDP
