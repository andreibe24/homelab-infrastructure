# MetalLB addressing for the webapp edge Services on the homelab LAN.
#
# Both Services carry `metallb.universe.tf/allow-shared-ip: webapp-api` in the base,
# so pinning the SAME address here publishes TCP/443 and UDP/443 on one IP -- which
# is what makes `alt-svc: h3=":443"` resolvable for the browser.
#
# DNS: point `api.webapp.homelab.lan` (A) at 192.168.1.240 and
#      `webapp.homelab.lan` (A) at the ingress-nginx LoadBalancer address.
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend-tls
  namespace: webapp
  annotations:
    metallb.universe.tf/address-pool: homelab-lan
spec:
  loadBalancerIP: 192.168.1.240
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend-quic
  namespace: webapp
  annotations:
    metallb.universe.tf/address-pool: homelab-lan
spec:
  loadBalancerIP: 192.168.1.240
