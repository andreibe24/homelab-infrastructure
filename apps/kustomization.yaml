---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./whoami/whoami.namespace.yaml
  - ./whoami/whoami.ks.yaml
  - ./sample-http3/sample-http3.namespace.yaml
  - ./sample-http3/sample-http3.ks.yaml
  - ./webapp-django-vite/webapp-django-vite.namespace.yaml
  - ./webapp-django-vite/webapp-django-vite.ks.yaml
  - ./networkpolicies.yaml
patches:
  - target:
      version: v1
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ignored
        annotations:
          linkerd.io/inject: enabled
