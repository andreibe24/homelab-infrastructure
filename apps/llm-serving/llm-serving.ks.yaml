---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-serving
  namespace: llm-serving
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./apps/llm-serving
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
