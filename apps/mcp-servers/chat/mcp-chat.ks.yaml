---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-chat
  namespace: mcp-chat
spec:
  dependsOn:
    - name: webapp-django-vite
      namespace: webapp-django-vite
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./apps/mcp-servers/chat
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
