apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: messaging-lab
  namespace: messaging-lab
spec:
  dependsOn:
    - name: dragonfly-operator
      namespace: redis-operator
    - name: rabbitmq
      namespace: rabbitmq
    - name: reflector
      namespace: reflector
    - name: secrets
      namespace: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  path: ./apps/messaging-lab
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      inProgress: "!has(status.phase) || status.phase != 'Ready'"
      current: "has(status.phase) && status.phase == 'Ready'"
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
