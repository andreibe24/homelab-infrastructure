apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: messaging-lab
      ports:
        - port: 6379
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator
          podSelector:
            matchLabels:
              control-plane: controller-manager
      ports:
        - port: 9999
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messaging-lab-egress
spec:
  podSelector:
    matchLabels:
      app: messaging-lab
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: messaging-lab-dragonfly
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq
          podSelector:
            matchLabels:
              app.kubernetes.io/component: rabbitmq
              app.kubernetes.io/name: rabbitmq
      ports:
        - port: 5671
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messaging-lab-dragonfly-egress
spec:
  podSelector:
    matchLabels:
      app: messaging-lab-dragonfly
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
