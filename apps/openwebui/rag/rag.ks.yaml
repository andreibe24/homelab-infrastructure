---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui-rag
  namespace: open-webui
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./apps/openwebui/rag
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
