---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-http3
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: sample-http3
  template:
    metadata:
      labels:
        app: sample-http3
    spec:
      initContainers:
        - name: generate-download
          image: caddy:2-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
          command:
            - /bin/sh
            - -c
            - dd if=/dev/urandom of=/srv/large.bin bs=1M count=8 && cp /index/index.html /srv/index.html
          volumeMounts:
            - name: data
              mountPath: /srv
            - name: index
              mountPath: /index
              readOnly: true
      containers:
        - name: caddy
          image: caddy:2-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: data
              mountPath: /srv
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sample-http3
        - name: data
          emptyDir: {}
        - name: index
          configMap:
            name: sample-http3
