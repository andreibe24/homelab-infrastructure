---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-http3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-http3
  template:
    metadata:
      labels:
        app: sample-http3
    spec:
      initContainers:
        - name: generate-download
          image: caddy:2-alpine
          command:
            - /bin/sh
            - -c
            - dd if=/dev/urandom of=/srv/large.bin bs=1M count=8
          volumeMounts:
            - name: data
              mountPath: /srv
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: quic
              containerPort: 443
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tls
              mountPath: /etc/caddy/tls
              readOnly: true
            - name: data
              mountPath: /srv
              readOnly: true
            - name: index
              mountPath: /srv/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sample-http3
        - name: data
          emptyDir: {}
        - name: index
          configMap:
            name: sample-http3
        - name: tls
          secret:
            secretName: sample-http3-tls
