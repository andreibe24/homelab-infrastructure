---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: chat-vectors
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-trixie@sha256:2114d9615a5c56004ff4f586032d0e61cbaca7c9449d3b57ea240630b28c37b8
  bootstrap:
    initdb:
      database: campfire_vectors
      owner: vector_app
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  storage:
    size: 2Gi
