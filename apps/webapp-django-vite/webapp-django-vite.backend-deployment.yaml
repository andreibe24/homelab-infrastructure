---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-django-vite-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-django-vite-backend
  template:
    metadata:
      labels:
        app: webapp-django-vite-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/andreibe24/homelab-infrastructure/webapp-django-vite-backend:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: webapp-django-vite
                  key: django-secret-key
            - name: DATABASE_NAME
              value: chatdb
            - name: DATABASE_HOST
              value: chat-db-rw
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: chat-db-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-db-app
                  key: password
            - name: ALLOWED_HOSTS
              value: chat.localhost
            - name: CSRF_TRUSTED_ORIGINS
              value: https://chat.localhost
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
