---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-django-vite-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-django-vite-frontend
  template:
    metadata:
      labels:
        app: webapp-django-vite-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/andreibe24/homelab-infrastructure/webapp-django-vite-frontend:1.1.8@sha256:c620cb2e9245766b47c8968899f214fd34e5d4de80c2667bc532018df79ace2b
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
