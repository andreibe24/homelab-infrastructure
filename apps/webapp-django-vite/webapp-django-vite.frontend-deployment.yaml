---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-django-vite-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-django-vite-frontend
  template:
    metadata:
      labels:
        app: webapp-django-vite-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/andreibe24/homelab-infrastructure/webapp-django-vite-frontend:1.2.1@sha256:7e8f27035bf2e948cebe1d85f95a949b7414edd01c49b76e4d65ccdea094927c
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
