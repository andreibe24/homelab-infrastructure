---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-django-vite-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-django-vite-frontend
  template:
    metadata:
      labels:
        app: webapp-django-vite-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/andreibe24/homelab-infrastructure/webapp-django-vite-frontend:1.2.0@sha256:e5519fc7d677b74a38cd651cf0b84558787aa163700e050b5e3a96a54d7e9f53
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
