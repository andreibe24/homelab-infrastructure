---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-django-vite-frontend
spec:
  selector:
    matchLabels:
      app: webapp-django-vite-frontend
  template:
    metadata:
      labels:
        app: webapp-django-vite-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/andreibe24/homelab-infrastructure/webapp-django-vite-frontend:1.4.6@sha256:be06714374bf30d4737173b85d1dda382016bab529c9cda0e45073e7e6d1f469
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
