---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-django-vite-frontend
spec:
  selector:
    matchLabels:
      app: webapp-django-vite-frontend
  template:
    metadata:
      labels:
        app: webapp-django-vite-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/andreibe24/homelab-infrastructure/webapp-django-vite-frontend:1.4.2@sha256:98b71ba3309ea042cef53ffb4196a1e9edc99096418abad23482bbe7fa5512d1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
