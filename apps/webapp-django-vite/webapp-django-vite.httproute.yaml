---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-django-vite
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - chat.localhost
  rules:
    - backendRefs:
        - name: webapp-django-vite-frontend
          port: 80
