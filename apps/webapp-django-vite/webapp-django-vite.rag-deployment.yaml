---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-django-vite-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-django-vite-rag
  template:
    metadata:
      labels:
        app: webapp-django-vite-rag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag
          image: ghcr.io/andreibe24/homelab-infrastructure/webapp-django-vite-rag:1.3.0@sha256:6af8da15bc5c77812614fd2e4aaee3852f61a53f61ff3b65752ef303001d914b
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CHAT_DATABASE_NAME
              value: chatdb
            - name: CHAT_DATABASE_HOST
              value: chat-db-rw
            - name: CHAT_DATABASE_PORT
              value: "5432"
            - name: CHAT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: chat-db-app
                  key: username
            - name: CHAT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-db-app
                  key: password
            - name: VECTOR_DATABASE_NAME
              value: campfire_vectors
            - name: VECTOR_DATABASE_HOST
              value: chat-vectors-rw
            - name: VECTOR_DATABASE_PORT
              value: "5432"
            - name: VECTOR_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: chat-vectors-app
                  key: username
            - name: VECTOR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-vectors-app
                  key: password
            - name: AGENTGATEWAY_BASE_URL
              value: http://agentgateway-proxy.agentgateway.svc.cluster.local:4000/v1
            - name: AGENTGATEWAY_CLIENT_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: agentgateway-client-keys
                  key: forum-app
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
