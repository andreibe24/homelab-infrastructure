---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: webapp-django-vite-backend
spec:
  scaleTargetRef:
    name: webapp-django-vite-backend
  minReplicaCount: 2
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
        containerName: backend
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
        containerName: backend
