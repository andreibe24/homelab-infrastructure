---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whoami
  namespace: whoami
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./apps/whoami
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
