kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true     # you install your own CNI
  kubeProxyMode: "none"       # only if your CNI replaces kube-proxy (Cilium); remove otherwise
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane       # a single control-plane node is schedulable by default
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 8080
        hostPort: 8080
        listenAddress: "127.0.0.1"   # reachable only from this machine, not the LAN
        protocol: TCP
      - containerPort: 8443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
