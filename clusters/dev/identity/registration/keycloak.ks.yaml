apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: keycloak
spec:
  dependsOn:
    - name: keycloak-operator
      namespace: keycloak
    - name: cloudnative-pg
      namespace: postgres-operator
    - name: gateway
      namespace: gateway
    - name: secrets
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: cert-manager
    - name: identity-trust
      namespace: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 20m
  path: ./clusters/dev/identity/keycloak
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
