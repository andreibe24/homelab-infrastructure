apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: keycloak
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./clusters/dev/identity/operator
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
