apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-trust
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/dev/identity/trust
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
