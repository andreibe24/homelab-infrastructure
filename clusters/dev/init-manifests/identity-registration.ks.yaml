apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-registration
spec:
  dependsOn:
    - name: infrastructure
    - name: secrets
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./clusters/dev/identity/registration
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
