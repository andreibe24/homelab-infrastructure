---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-release
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/cert-manager/release
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-release
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/cert-manager/issuers
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # ClusterIssuer/Certificate need cert-manager's CRDs, which only exist once
  # cert-manager-release is actually Ready (not just applied).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkerd-pki
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-release
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/linkerd/pki
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: linkerd-trust-anchor
      namespace: linkerd
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: linkerd-identity-issuer
      namespace: linkerd
  # The trust anchor/identity issuer Certificates need cert-manager's CRDs
  # (hence dependsOn cert-manager-release) and must be Ready BEFORE
  # linkerd-release, because linkerd-control-plane's HelmRelease consumes the
  # resulting Secret as a Helm value (valuesFrom).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkerd-release
  namespace: flux-system
spec:
  dependsOn:
    - name: linkerd-pki
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  path: ./infrastructure/linkerd/release
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkerd-policy
  namespace: flux-system
spec:
  dependsOn:
    - name: linkerd-release
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/linkerd/policy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # AuthorizationPolicy/MeshTLSAuthentication need the Linkerd CRDs installed
  # by linkerd-release's HelmReleases.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  path: ./infrastructure/actions-runner-controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Single stage: the two HelmReleases order themselves via
  # HelmRelease.spec.dependsOn, and NetworkPolicy/RBAC/DaemonSet have no CRD
  # dependency, so nothing here needs to wait on a separate Kustomization. Not
  # dependent on cert-manager/linkerd: arc-systems/arc-runners are unmeshed.
  #
  # Once SOPS is in use (topic 3 decision), add:
  # decryption:
  #   provider: sops
  #   secretRef:
  #     name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-release
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  path: ./infrastructure/observability/release
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Not dependent on cert-manager/linkerd: kube-prometheus-stack installs fine
  # unmeshed; the observability Namespace's `linkerd.io/inject: enabled`
  # annotation only takes effect once linkerd-release happens to be ready too,
  # which is not required for this HelmRelease to succeed.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-crs
  namespace: flux-system
spec:
  dependsOn:
    - name: observability-release
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./infrastructure/observability/crs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # ServiceMonitor/PodMonitor/PrometheusRule/AlertmanagerConfig need the
  # Prometheus Operator CRDs bundled in kube-prometheus-stack.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./infrastructure/renovate
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Single stage: Renovate ships no CRDs and needs no custom resources.
