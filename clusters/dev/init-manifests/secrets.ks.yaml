---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/dev/init-manifests/secrets
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
