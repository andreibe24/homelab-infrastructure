apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - ../../../../infrastructure/imported/cilium
configMapGenerator:
  - name: cilium-custom-helmvalues
    behavior: replace
    files:
      - values.yaml=custom.helmvalues
generatorOptions:
  disableNameSuffixHash: true
