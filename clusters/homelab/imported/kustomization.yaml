apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/imported
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: cilium
      namespace: kube-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./infrastructure/imported/overlays/cilium/homelab
      - op: add
        path: /spec/postBuild
        value:
          substituteFrom:
            - kind: ConfigMap
              name: homelab-cilium-settings
