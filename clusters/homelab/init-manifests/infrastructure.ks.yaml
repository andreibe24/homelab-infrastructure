apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
spec:
  suspend: true
  interval: 1h
  retryInterval: 1m
  timeout: 50m
  path: ./infrastructure/components
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
