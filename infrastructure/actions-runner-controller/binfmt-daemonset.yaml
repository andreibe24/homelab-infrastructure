# QEMU/binfmt_misc registration for multi-arch container builds.
#
# The rootless buildkitd sidecar inside each runner pod can only execute arm64
# RUN steps if the *kernel* of the node knows how to run arm64 ELF binaries.
# binfmt_misc handlers are a host-kernel property, so they are registered once per
# node by this DaemonSet instead of by a privileged init container inside every
# ephemeral runner pod. Net effect:
#
#   * exactly one privileged pod per node, short-lived work (register, then idle),
#     auditable and separate from any code that comes from GitHub;
#   * runner + buildkitd stay unprivileged (see helmrelease-runner-scale-set.yaml);
#   * `docker buildx build --platform linux/amd64,linux/arm64` works on an
#     amd64-only homelab.
#
# The handlers are registered with the "F" (fix-binary) flag, which is what makes
# them usable from inside containers that do not ship the qemu binaries.
#
# Alternative if emulation is too slow: join a real arm64 node to the cluster and
# add a second runner scale set / buildkit worker on it, then let buildx federate
# the two builders. Emulated arm64 builds are typically 3-10x slower.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: binfmt
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: binfmt
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: ci
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: binfmt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: binfmt
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: ci
    spec:
      # Handlers are installed on the host kernel, hence hostPID + privileged.
      hostPID: true
      initContainers:
        - name: install-qemu
          # renovate: datasource=docker depName=tonistiigi/binfmt
          image: tonistiigi/binfmt:qemu-v10.2.3
          args: ["--install", "arm64,arm"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        # Nothing to do after registration; the pod just has to stay Running so
        # the DaemonSet does not restart-loop.
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65535
            capabilities:
              drop:
                - ALL
      tolerations:
        - effect: NoSchedule
          operator: Exists
