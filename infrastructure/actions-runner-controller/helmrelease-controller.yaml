# actions-runner-controller (ARC) -- modern "runner scale set" generation.
#
# Chart:  oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
# Source: HelmRepository/actions-runner-controller (flux-system, type: oci)
#
# This release installs ONLY the controller + its CRDs (AutoscalingRunnerSet,
# AutoscalingListener, EphemeralRunner, EphemeralRunnerSet). Runner pods come from
# the separate `gha-runner-scale-set` release in helmrelease-runner-scale-set.yaml.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: arc-systems
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      # renovate: datasource=docker registryUrl=oci://ghcr.io/actions/actions-runner-controller-charts
      # Pinned on purpose -- verify against
      # https://github.com/actions/actions-runner-controller/releases and let
      # Renovate (topic 6) propose the bump.
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1

    # The ServiceAccount name is derived from the release name:
    #   <release>-gha-rs-controller  ->  arc-gha-rs-controller
    # The gha-runner-scale-set chart needs it (it otherwise tries to auto-discover
    # the controller Deployment with a Helm `lookup`, which is fragile under Flux),
    # so it is referenced explicitly in helmrelease-runner-scale-set.yaml.
    serviceAccount:
      create: true

    flags:
      logLevel: info
      logFormat: json
      # "eventual" = never kill a pod that is still running a job when the chart
      # or runner image is updated; the listener/runner set is recreated only once
      # the queue has drained. Slower rollouts, zero interrupted CI jobs.
      updateStrategy: eventual
      runnerMaxConcurrentReconciles: 2

    # Prometheus metrics for topic 5 (a ServiceMonitor scraping :8080 belongs to
    # ../observability/crs/, not here).
    metrics:
      controllerManagerAddr: ":8080"
      listenerAddr: ":8080"
      listenerEndpoint: "/metrics"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
