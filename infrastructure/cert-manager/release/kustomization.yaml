apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cert-manager — release stage.
#
# Namespace + HelmRepository + HelmRelease. Reconciled by
# Kustomization/cert-manager-release (clusters/homelab/infrastructure.yaml).
# `../issuers/` depends on this stage (dependsOn + wait: true) because
# ClusterIssuer/Certificate objects need cert-manager's CRDs to already be
# registered.
resources:
  - namespace.yaml
  - helm-repository.yaml
  - helmrelease.yaml
