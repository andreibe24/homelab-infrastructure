---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-config
  namespace: agentgateway
spec:
  dependsOn:
    - name: agentgateway
    - name: secrets
      namespace: flux-system
    - name: reflector
      namespace: reflector
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/components/agentgateway-config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
