---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - "agentgateway.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      timeouts:
        request: 300s
        backendRequest: 300s
      backendRefs:
        - name: agentgateway-proxy
          port: 4000
