---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: copilot
spec:
  parentRefs:
    - name: agentgateway-proxy
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
        - path:
            type: Exact
            value: /v1/messages
        - path:
            type: Exact
            value: /v1/responses
      timeouts:
        request: 300s
        backendRequest: 300s
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: copilot
