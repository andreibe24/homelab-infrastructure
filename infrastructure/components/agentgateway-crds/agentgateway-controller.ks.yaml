---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-controller
  namespace: agentgateway-system
spec:
  dependsOn:
    - name: agentgateway-crds
      namespace: agentgateway-system
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/agentgateway-crds/controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
