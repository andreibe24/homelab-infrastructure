---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-copilot
  namespace: agentgateway-system
spec:
  dependsOn:
    - name: agentgateway-controller
      namespace: agentgateway-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/agentgateway-crds/copilot
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
