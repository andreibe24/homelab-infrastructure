---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: agentgateway-ratelimit-dragonfly
spec:
  replicas: 2
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
  imagePullPolicy: IfNotPresent
  serviceAccountName: agentgateway-ratelimit-dragonfly
  podMetadata:
    annotations:
      config.linkerd.io/opaque-ports: "65000"
  serviceSpec:
    annotations:
      config.linkerd.io/opaque-ports: "65000"
  args:
    - --maxmemory=256mb
    - --cache_mode=false
    - --proactor_threads=1
  snapshot:
    cron: "* * * * *"
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
