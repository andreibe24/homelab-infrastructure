---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-ratelimit-dragonfly
spec:
  podSelector:
    matchLabels:
      app: agentgateway-ratelimit-dragonfly
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the limiter can use the Redis-compatible data port.
    - from:
        - podSelector:
            matchLabels:
              app: agentgateway-ratelimit
      ports:
        - port: 6379
          protocol: TCP
    # The operator needs the separate admin port to configure the master.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator
          podSelector:
            matchLabels:
              control-plane: controller-manager
      ports:
        - port: 9999
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
          podSelector:
            matchLabels:
              linkerd.io/control-plane-component: identity
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
          podSelector:
            matchLabels:
              linkerd.io/control-plane-component: destination
      ports:
        - port: 8086
          protocol: TCP
        - port: 8090
          protocol: TCP
