---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-ratelimit-redis
spec:
  podSelector:
    matchLabels:
      app: agentgateway-ratelimit-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Redis has no client-facing access; only limiter pods in this namespace may connect.
    - from:
        - podSelector:
            matchLabels:
              app: agentgateway-ratelimit
      ports:
        - port: 6379
          protocol: TCP
  # Redis only replies to established connections; it initiates no outbound traffic.
  egress: []
