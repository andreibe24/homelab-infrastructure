---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-ratelimit
  namespace: agentgateway
spec:
  dependsOn:
    - name: reloader
      namespace: reloader
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/components/agentgateway-ratelimit
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
