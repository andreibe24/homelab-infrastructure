---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agentgateway-ratelimit
spec:
  scaleTargetRef:
    name: agentgateway-ratelimit
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
        containerName: ratelimit
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
        containerName: ratelimit
