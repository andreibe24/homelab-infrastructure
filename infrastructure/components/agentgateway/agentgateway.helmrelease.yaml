---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  dependsOn:
    - name: agentgateway-crds
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: agentgateway
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      replicaCount: 2
    fullnameOverride: agentgateway-controller
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    istio:
      enabled: false
