---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
