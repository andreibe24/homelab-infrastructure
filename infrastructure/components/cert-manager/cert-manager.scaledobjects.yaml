---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cert-manager
spec:
  scaleTargetRef:
    name: cert-manager
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: AverageValue
      metadata:
        value: 500m
    - type: memory
      metricType: AverageValue
      metadata:
        value: 256Mi
