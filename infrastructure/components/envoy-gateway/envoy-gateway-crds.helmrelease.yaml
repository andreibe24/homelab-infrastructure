---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
