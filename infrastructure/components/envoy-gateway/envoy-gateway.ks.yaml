---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  dependsOn:
    - name: envoy-gateway-crds
    - name: linkerd
      namespace: linkerd
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/envoy-gateway
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
