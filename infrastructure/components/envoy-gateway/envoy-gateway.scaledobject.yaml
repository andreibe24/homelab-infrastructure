---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: envoy-gateway
spec:
  scaleTargetRef:
    name: envoy-gateway
  minReplicaCount: 2
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: AverageValue
      metadata:
        value: 500m
    - type: memory
      metricType: AverageValue
      metadata:
        value: 256Mi
