---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falco-ui
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - "falco.localhost"
  rules:
    - backendRefs:
        - name: falco-falcosidekick-ui
          port: 2802
