---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external-http2
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  http2: {}
  tls:
    # Offer h2 (HTTP/2) and http/1.1 (the fallback)
    alpnProtocols:
      - h2
      - http/1.1
