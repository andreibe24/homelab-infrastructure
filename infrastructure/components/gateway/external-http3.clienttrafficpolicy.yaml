---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external-http3
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  http2: {}
  http3: {}
  tls:
    # HTTP/3 uses QUIC; retain HTTP/2 and HTTP/1.1 over TCP as fallbacks.
    alpnProtocols:
      - h2
      - http/1.1
