---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
spec:
  # Cilium's host-network Envoy uses base ID 0 on this node.
  extraArgs:
    - --base-id 1
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
              template:
                spec:
                  # kind port mappings reach the node network namespace directly.
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
      envoyService:
        type: ClusterIP
