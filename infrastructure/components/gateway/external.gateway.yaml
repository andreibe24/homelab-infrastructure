---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
spec:
  gatewayClassName: cilium
  listeners:
    - name: http-wildcard
      protocol: HTTP
      port: 8080
      hostname: "*.localhost"
      allowedRoutes:
        namespaces:
          from: All
    - name: http-apex
      protocol: HTTP
      port: 8080
      hostname: "localhost"
      allowedRoutes:
        namespaces:
          from: All
    - name: https-wildcard
      protocol: HTTPS
      port: 8443
      hostname: "*.localhost"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: localhost-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      protocol: HTTPS
      port: 8443
      hostname: "localhost"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: localhost-tls
      allowedRoutes:
        namespaces:
          from: All
