---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
spec:
  gatewayClassName: cilium
  listeners:
    # Omitting 'hostname' on the HTTP listener creates a wildcard domain match ("*") in Envoy.
    # This ensures any HTTP request on port 8080 (including non-standard host headers with port suffixes
    # like 'flux.localhost:8080') is captured and redirected to HTTPS on port 8443.
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
    - name: https-wildcard
      protocol: HTTPS
      port: 8443
      hostname: "*.localhost"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: localhost-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      protocol: HTTPS
      port: 8443
      hostname: "localhost"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: localhost-tls
      allowedRoutes:
        namespaces:
          from: All
