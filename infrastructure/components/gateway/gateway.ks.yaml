---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: gateway
spec:
  dependsOn:
    - name: cert-manager-issuers
      namespace: cert-manager
    # Installs Envoy Gateway's CRDs before applying its custom resources.
    - name: envoy-gateway
      namespace: envoy-gateway
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/gateway
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
