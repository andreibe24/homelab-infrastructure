---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
    - name: external
      sectionName: http
  # Omitting 'hostnames' allows this redirect route to match any host hitting the 'http' listener.
  # Combined with the catch-all HTTP listener, this cleanly redirects all HTTP requests to HTTPS.
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 8443
            statusCode: 301
