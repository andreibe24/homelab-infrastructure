---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
    - name: external
      sectionName: http-wildcard
    - name: external
      sectionName: http-apex
  # Omitting 'hostnames' attaches this route to all hostnames accepted by the referenced
  # HTTP listeners (*.localhost and localhost). This allows Envoy to catch and redirect
  # all incoming HTTP requests regardless of host headers or non-standard port suffixes (:8080).
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 8443
            statusCode: 301
