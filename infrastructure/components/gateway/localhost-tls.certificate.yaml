---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: localhost-tls
spec:
  secretName: localhost-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  commonName: localhost
  dnsNames:
    - "localhost"
    - "*.localhost"
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer
