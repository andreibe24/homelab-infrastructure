---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda
  namespace: keda
spec:
  dependsOn:
    - name: metrics-server
      namespace: metrics-server
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/keda
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
