---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cert-manager/cert-manager.namespace.yaml
  - ./cert-manager/cert-manager.ks.yaml
  - ./cert-manager/cert-manager-issuers.ks.yaml
  - ./linkerd/linkerd.namespace.yaml
  - ./linkerd/linkerd-certificates.ks.yaml
  - ./linkerd/linkerd.ks.yaml
  - ./envoy-gateway/envoy-gateway.namespace.yaml
  - ./envoy-gateway-crds/envoy-gateway-source.ks.yaml
  - ./envoy-gateway-crds/envoy-gateway-crds.ks.yaml
  - ./envoy-gateway/envoy-gateway.ks.yaml
  - ./gateway/gateway.namespace.yaml
  - ./gateway/gateway.ks.yaml
  - ./falco/falco.namespace.yaml
  - ./falco/falco.ks.yaml
  - ./reflector/reflector.namespace.yaml
  - ./reflector/reflector.ks.yaml
  - ./reloader/reloader.namespace.yaml
  - ./reloader/reloader.ks.yaml
  - ./monitoring/monitoring.namespace.yaml
  - ./monitoring/monitoring.ks.yaml
  - ./agentgateway/agentgateway.namespace.yaml
  - ./agentgateway/agentgateway.ks.yaml
  - ./agentgateway-ratelimit/agentgateway-ratelimit.ks.yaml
  - ./agentgateway-config/agentgateway-config.ks.yaml
  - ./postgres-operator/postgres-operator.namespace.yaml
  - ./postgres-operator/cloudnative-pg.kustomization.yaml
  - ./redis-operator/redis-operator.namespace.yaml
  - ./redis-operator/dragonfly-operator.kustomization.yaml
  - ./networkpolicies.yaml
patches:
  - target:
      version: v1
      kind: Namespace
      labelSelector: homelab.local/linkerd-injection!=disabled
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ignored
        annotations:
          linkerd.io/inject: enabled
