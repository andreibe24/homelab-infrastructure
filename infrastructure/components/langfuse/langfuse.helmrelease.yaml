---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: langfuse
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    langfuse:
      salt:
        secretKeyRef:
          name: langfuse
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse
          key: encryption-key
      nextauth:
        url: https://langfuse.localhost:8443
        secret:
          secretKeyRef:
            name: langfuse
            key: nextauth-secret
      features:
        telemetryEnabled: false
        signUpDisabled: true
      # Headless initialisation creates the organisation, project, API keys and admin user.
      additionalEnv:
        - name: LANGFUSE_INIT_ORG_ID
          value: homelab
        - name: LANGFUSE_INIT_ORG_NAME
          value: Homelab
        - name: LANGFUSE_INIT_PROJECT_ID
          value: llm-gateway
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: LLM gateway
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse
              key: init-public-key
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse
              key: init-secret-key
        - name: LANGFUSE_INIT_USER_EMAIL
          value: admin@homelab.local
        - name: LANGFUSE_INIT_USER_NAME
          value: admin
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse
              key: init-user-password
      web:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
        pdb:
          create: false
      worker:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
        pdb:
          create: false
    # ClickHouse is deployed by clickhouse.statefulset.yaml, not the operator-based chart path.
    clickhouse:
      deploy: false
      host: langfuse-clickhouse
      crdCheck: false
      cluster:
        enabled: false
      auth:
        existingSecret: langfuse
        existingSecretKey: clickhouse-password
    postgresql:
      storage:
        requestedSize: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    redis:
      dataStorage:
        requestedSize: 1Gi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
