---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse
  namespace: langfuse
spec:
  dependsOn:
    - name: gateway
      namespace: gateway
    - name: secrets
      namespace: flux-system
    - name: reflector
      namespace: reflector
  interval: 1h
  retryInterval: 1m
  timeout: 20m
  path: ./infrastructure/components/langfuse
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
