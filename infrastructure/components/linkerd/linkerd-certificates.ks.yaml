---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkerd-certificates
  namespace: linkerd
spec:
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/linkerd/certificates
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
