---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-control-plane
spec:
  dependsOn:
    - name: linkerd-crds
  interval: 30m
  chart:
    spec:
      chart: linkerd-control-plane
      version: 2026.10.2
      sourceRef:
        kind: HelmRepository
        name: linkerd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: linkerd-trust-anchor
      valuesKey: tls.crt
      targetPath: identityTrustAnchorsPEM
  values:
    identity:
      issuer:
        scheme: kubernetes.io/tls
    proxy:
      nativeSidecar: true
      outboundTransportMode: transparent
