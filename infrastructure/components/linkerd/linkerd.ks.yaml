---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkerd
  namespace: linkerd
spec:
  dependsOn:
    - name: linkerd-certificates
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure/components/linkerd
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
