---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
          - target_matchers:
              - alertname = InfoInhibitor
        route:
          group_by:
            - alertname
            - namespace
            - cluster
          # Slack waits 30s for a new alert group before its first notification.
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          # Only the allow-listed alert names below are sent to Slack; all others are discarded.
          receiver: "null"
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: slack
              matchers:
                - alertname =~ "^(KubernetesContainerOOMKilled|KubernetesPodProbeFailure|KubePodCrashLooping|FluxKustomizationNotReady|FluxGitRepositoryNotReady|FluxHelmReleaseNotReady|KubeNodeNotReady)$"
        receivers:
          - name: slack
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_api_url
                title: '[Cluster: {{ .CommonLabels.cluster }}] {{ .CommonLabels.alertname }}'
                text: |-
                  {{ range .Alerts }}
                  {{ if .Labels.namespace }}*Namespace:* `{{ .Labels.namespace }}`{{ else if .Labels.exported_namespace }}*Namespace:* `{{ .Labels.exported_namespace }}`{{ end }}
                  {{ if .Labels.pod }}*Pod:* `{{ .Labels.pod }}`{{ end }}
                  {{ if .Labels.node }}*Node:* `{{ .Labels.node }}`{{ end }}
                  {{ if and .Labels.kind .Labels.name }}*Resource:* `{{ .Labels.kind }}/{{ .Labels.name }}`{{ end }}
                  {{ if and .Labels.customresource_kind .Labels.name }}*Resource:* `{{ .Labels.customresource_kind }}/{{ .Labels.name }}`{{ end }}
                  {{ if .Labels.container }}*Container:* `{{ .Labels.container }}`{{ end }}
                  {{ if .Labels.probe_type }}*Probe:* `{{ .Labels.probe_type }}`{{ end }}
                  {{ if .Labels.instance }}*Instance:* `{{ .Labels.instance }}`{{ end }}
                  {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
                  {{ end }}
                send_resolved: true
          - name: "null"
      alertmanagerSpec:
        podMetadata:
          annotations:
            reloader.stakater.com/auto: "true"
        secrets:
          - alertmanager-slack
    additionalPrometheusRulesMap:
      cluster-health:
        groups:
          # OOM and probe alerts have no `for` delay: they fire on the first rule evaluation
          # that sees the condition (30s evaluation interval), then Slack applies group_wait.
          - name: kubernetes-container-health
            rules:
              - alert: KubernetesContainerOOMKilled
                expr: |
                  increase(kube_pod_container_status_restarts_total[10m]) > 0
                  and on (namespace, pod, container)
                  kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                labels:
                  severity: warning
                annotations:
                  summary: Kubernetes container was OOMKilled
                  description: >-
                    Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
                    was OOMKilled.
              - alert: KubernetesPodProbeFailure
                expr: |
                  increase(prober_probe_total{probe_type=~"(?i)(readiness|liveness)", result="failed"}[5m]) > 0
                labels:
                  severity: warning
                annotations:
                  summary: Kubernetes pod readiness or liveness probe failed
                  description: >-
                    The {{ $labels.probe_type }} probe failed for container {{ $labels.container }}
                    in pod {{ $labels.namespace }}/{{ $labels.pod }}.
              # Flux alerts below require Ready=False to persist continuously for 30 minutes.
              - alert: FluxKustomizationNotReady
                expr: |
                  max by (customresource_kind, exported_namespace, name) (
                    gotk_resource_info{customresource_kind="Kustomization", ready="False"}
                  ) == 1
                for: 30m
                labels:
                  severity: warning
                  namespace: "{{ $labels.exported_namespace }}"
                annotations:
                  summary: Flux Kustomization is not ready
                  description: >-
                    Flux Kustomization {{ $labels.name }} in namespace {{ $labels.exported_namespace }}
                    is not Ready.
              - alert: FluxGitRepositoryNotReady
                expr: |
                  max by (customresource_kind, exported_namespace, name) (
                    gotk_resource_info{customresource_kind="GitRepository", ready="False"}
                  ) == 1
                for: 30m
                labels:
                  severity: warning
                  namespace: "{{ $labels.exported_namespace }}"
                annotations:
                  summary: Flux GitRepository is not ready
                  description: >-
                    Flux GitRepository {{ $labels.name }} in namespace {{ $labels.exported_namespace }}
                    is not Ready.
              - alert: FluxHelmReleaseNotReady
                expr: |
                  max by (customresource_kind, exported_namespace, name) (
                    gotk_resource_info{customresource_kind="HelmRelease", ready="False"}
                  ) == 1
                for: 30m
                labels:
                  severity: warning
                  namespace: "{{ $labels.exported_namespace }}"
                annotations:
                  summary: Flux HelmRelease is not ready
                  description: >-
                    Flux HelmRelease {{ $labels.name }} in namespace {{ $labels.exported_namespace }}
                    is not Ready.
    kube-state-metrics:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - gitrepositories
              - helmreleases
            verbs:
              - list
              - watch
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - "[type=Ready]"
                        - status
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - "[type=Ready]"
                        - status
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name:
                            - metadata
                            - name
                    labelsFromPath:
                      exported_namespace:
                        - metadata
                        - namespace
                      ready:
                        - status
                        - conditions
                        - "[type=Ready]"
                        - status
    # Chart defaults delay KubePodCrashLooping and KubeNodeNotReady by 15m each.
    defaultRules:
      create: true
      rules:
        etcd: false
    grafana:
      defaultDashboardsEnabled: true
    kubeEtcd:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 2d
        externalLabels:
          cluster: dev
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
