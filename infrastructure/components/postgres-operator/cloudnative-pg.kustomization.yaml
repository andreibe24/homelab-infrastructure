---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: postgres-operator
spec:
  dependsOn:
    - name: linkerd
      namespace: linkerd
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/postgres-operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
