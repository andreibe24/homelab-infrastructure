apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  dependsOn:
    - name: cert-manager-issuers
      namespace: cert-manager
    - name: linkerd
      namespace: linkerd
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure/components/rabbitmq
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: rabbitmq.com/v1beta1
      kind: RabbitmqCluster
      current: "has(status.conditions) && status.conditions.exists(c, c.type == 'AllReplicasReady' && c.status == 'True')"
      inProgress: "!has(status.conditions) || !status.conditions.exists(c, c.type == 'AllReplicasReady' && c.status == 'True')"
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
