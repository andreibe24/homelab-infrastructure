---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly-operator
  namespace: redis-operator
spec:
  dependsOn:
    - name: keda
      namespace: keda
    - name: linkerd
      namespace: linkerd
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/redis-operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
