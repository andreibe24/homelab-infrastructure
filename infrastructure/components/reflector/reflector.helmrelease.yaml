---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: 9.0.352
      sourceRef:
        kind: HelmRepository
        name: emberstack
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
