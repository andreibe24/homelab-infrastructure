---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/components/reflector
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-infrastructure
    namespace: flux-system
