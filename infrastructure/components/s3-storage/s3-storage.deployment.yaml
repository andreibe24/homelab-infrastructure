---
# S3-compatible gateway in front of the "apps" folder of the configured remote
# storage (currently Google Drive). Each sub-folder is a bucket, so an
# application stores its files in the bucket named after itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-storage
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-storage
  template:
    metadata:
      labels:
        app: s3-storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rclone
          image: rclone/rclone:1.75.2
          command:
            - /bin/sh
            - -c
            # Work on a copy: rclone rewrites its config when it refreshes tokens.
            - >-
              cp /storage-config/rclone.conf /tmp/rclone.conf &&
              exec rclone serve s3 storage:apps --addr :8080
              --auth-key "$S3_ACCESS_KEY,$S3_SECRET_KEY"
          env:
            - name: HOME
              value: /tmp
            - name: RCLONE_CONFIG
              value: /tmp/rclone.conf
            - name: RCLONE_DRIVE_USE_TRASH
              value: "false"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-storage-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-storage-credentials
                  key: secret-key
          ports:
            - name: s3
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: s3
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
          volumeMounts:
            - name: storage-config
              mountPath: /storage-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: storage-config
          secret:
            secretName: s3-storage-backend
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
