apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Topic 3 -- ci-self-hosted-runners (config stage).
#
# Plain Kubernetes objects that support the runner scale set declared in
# infrastructure/controllers/actions-runner-controller/. They are applied after
# `infra-controllers` is Ready, so the ARC CRDs and the chart-managed
# ServiceAccount referenced by rbac.yaml already exist.
resources:
  - networkpolicy.yaml
  - rbac.yaml
  - binfmt-daemonset.yaml
