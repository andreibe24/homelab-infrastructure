apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Custom resources that only become valid AFTER the controllers above are Ready,
# reconciled by Kustomization/infra-configs.
#
# Typical contents per topic:
#   linkerd/      Issuer + Certificate (trust anchor, identity issuer), Server/
#                 ServerAuthorization or AuthorizationPolicy
#   actions-runner-controller/
#                 AutoscalingRunnerSet / RunnerDeployment, BuildKit StatefulSet or
#                 Kaniko RBAC, SealedSecret/SOPS-encrypted GitHub App credentials
#   observability/
#                 ServiceMonitor, PodMonitor, PrometheusRule, Alertmanager routes,
#                 Grafana dashboard ConfigMaps
#   renovate/     (not used -- see note below)
#
# topic 6 (renovate): NOTHING here on purpose. Renovate ships no CRDs and needs
# no custom resources, so its CronJob + ServiceAccount live entirely in
# infrastructure/controllers/renovate/ and are applied in the infra-controllers
# stage. See infrastructure/controllers/renovate/README.md.
resources:
  - actions-runner-controller
  - cert-manager   # topic 2: shared ClusterIssuers (selfsigned + homelab-ca)
  - linkerd        # topic 2: mesh policy CRs. The Linkerd PKI in linkerd/pki/ is
                   # intentionally NOT part of this stage -- it is reconciled by
                   # Kustomization/linkerd-pki during the controllers stage; see
                   # infrastructure/controllers/linkerd/kustomization-pki.yaml.
  - observability  # topic 5: ServiceMonitors/PodMonitors, PrometheusRules,
                   # AlertmanagerConfig and the Grafana dashboard ConfigMap.
