# Linkerd identity issuer — the intermediate CA that the linkerd-identity
# controller uses to mint the short-lived (24h) leaf certificates that each
# proxy presents to its peers.
#
# This is the certificate that makes the whole setup "GitOps native": it lives
# for 48h and cert-manager reissues it after 23h of age, entirely without a git
# commit. linkerd-identity picks up the new credentials from the Secret; verify
# with `linkerd check --proxy`.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
  labels:
    app.kubernetes.io/part-of: linkerd
spec:
  ca:
    # Produced by Certificate/linkerd-trust-anchor in trust-anchor.yaml.
    secretName: linkerd-trust-anchor
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-identity-issuer
  namespace: linkerd
  labels:
    app.kubernetes.io/part-of: linkerd
spec:
  # Mounted by the linkerd-identity Deployment; the control plane is configured
  # with `identity.issuer.scheme: kubernetes.io/tls` so it reads tls.crt/tls.key
  # from this cert-manager-managed Secret instead of a chart-templated one.
  secretName: linkerd-identity-issuer
  isCA: true
  commonName: identity.linkerd.cluster.local
  dnsNames:
    - identity.linkerd.cluster.local
  duration: 48h
  renewBefore: 25h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages:
    - cert sign
    - crl sign
    - server auth
    - client auth
  issuerRef:
    name: linkerd-trust-anchor
    kind: Issuer
    group: cert-manager.io
