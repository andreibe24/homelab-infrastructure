# CronJob / batch-job alerting — the headline requirement from the user's todo:
#
#     "notify incidents, k8s cronjob poller fails, etc."
#
# All of these are built on kube-state-metrics series (kube_job_*, kube_cronjob_*),
# which the kube-prometheus-stack HelmRelease enables and scrapes by default.
#
# Alerts carry `category: cronjob` so the AlertmanagerConfig in this directory can
# route them to the chat/webhook receiver without matching on alert names.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cronjob-failures
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: cronjob.rules
      interval: 1m
      rules:
        # --- the poller-failed alert -----------------------------------------
        - alert: CronJobFailed
          # kube_job_status_failed counts failed pods per Job; joining on
          # kube_job_owner{owner_kind="CronJob"} narrows it to Jobs that a CronJob
          # created and brings the CronJob's name in as `owner_name`.
          expr: |
            sum by (namespace, job_name, owner_name) (
              (kube_job_status_failed{job="kube-state-metrics"} > 0)
                * on (namespace, job_name) group_left(owner_name)
              kube_job_owner{job="kube-state-metrics", owner_kind="CronJob"}
            ) > 0
          for: 2m
          labels:
            severity: critical
            category: cronjob
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.owner_name }} failed"
            description: >-
              Job {{ $labels.job_name }} created by CronJob
              {{ $labels.namespace }}/{{ $labels.owner_name }} has
              {{ $value }} failed pod(s). Inspect with:
              kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed"

        # --- "the poller stopped polling" ------------------------------------
        - alert: CronJobNotScheduledRecently
          # A CronJob that has not been scheduled for over 24h is either suspended,
          # broken, or its controller is wedged. Tune per-CronJob by adding a more
          # specific rule (see RenovateCronJobStale below) rather than loosening
          # this one.
          expr: |
            (time() - kube_cronjob_status_last_schedule_time{job="kube-state-metrics"}) > 86400
            and on (namespace, cronjob) kube_cronjob_spec_suspend{job="kube-state-metrics"} == 0
          for: 15m
          labels:
            severity: warning
            category: cronjob
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not run in over 24h"
            description: >-
              Last schedule time was
              {{ $value | humanizeDuration }} ago while the CronJob is not
              suspended. The schedule may be wrong or the job controller stuck.

        - alert: CronJobNoRecentSuccess
          # Distinct from CronJobFailed: covers the case where every run is being
          # evicted / OOM-killed / never completing, so no success is recorded.
          expr: |
            (time() - kube_cronjob_status_last_successful_time{job="kube-state-metrics"}) > 172800
            and on (namespace, cronjob) kube_cronjob_spec_suspend{job="kube-state-metrics"} == 0
          for: 30m
          labels:
            severity: warning
            category: cronjob
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in 48h"
            description: "No successful completion recorded for {{ $value | humanizeDuration }}."

        - alert: CronJobRunningTooLong
          expr: |
            (time() - kube_job_status_start_time{job="kube-state-metrics"} > 3600)
              and on (namespace, job_name)
            kube_job_status_active{job="kube-state-metrics"} > 0
          for: 5m
          labels:
            severity: warning
            category: cronjob
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has been running for over 1h"
            description: >-
              Long-running batch job — a hung poller usually looks exactly like
              this. Started {{ $value | humanizeDuration }} ago.

        - alert: CronJobSuspended
          expr: kube_cronjob_spec_suspend{job="kube-state-metrics"} == 1
          for: 1h
          labels:
            severity: info
            category: cronjob
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is suspended"
            description: "Suspended CronJobs never fire — confirm this is intentional."

    # ---------------------------------------------------------------------------
    # Topic 6's Renovate CronJob is the canonical poller in this cluster: it runs
    # once a day and silently doing nothing is indistinguishable from "no updates"
    # unless it is alerted on explicitly.
    - name: cronjob.renovate.rules
      interval: 1m
      rules:
        - alert: RenovateCronJobFailed
          expr: |
            sum by (namespace, job_name, owner_name) (
              (kube_job_status_failed{job="kube-state-metrics", namespace="renovate"} > 0)
                * on (namespace, job_name) group_left(owner_name)
              kube_job_owner{job="kube-state-metrics", owner_kind="CronJob", namespace="renovate"}
            ) > 0
          for: 2m
          labels:
            severity: critical
            category: cronjob
            topic: renovate
          annotations:
            summary: "Renovate run failed ({{ $labels.job_name }})"
            description: >-
              The daily dependency-update poller failed; the repo will silently
              stop receiving update PRs until this is fixed.

        - alert: RenovateCronJobStale
          # Daily schedule + 50% grace. If the CronJob is installed via the Helm
          # chart with a different schedule, adjust the 129600s (36h) threshold.
          expr: |
            (time() - kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="renovate"}) > 129600
          for: 30m
          labels:
            severity: warning
            category: cronjob
            topic: renovate
          annotations:
            summary: "Renovate has not completed successfully in 36h"
            description: "Expected a daily run; last success was {{ $value | humanizeDuration }} ago."
