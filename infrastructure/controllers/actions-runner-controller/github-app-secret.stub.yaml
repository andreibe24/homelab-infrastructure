# PLACEHOLDER -- NOT APPLIED BY FLUX.
#
# This file is deliberately absent from kustomization.yaml: it contains dummy
# values. Replace it via SOPS or sealed-secrets, then add the encrypted file to
# `resources:` in kustomization.yaml.
#
# Populate github_app_id / github_app_installation_id / github_app_private_key
# (PREFERRED) **OR** github_token (PAT fallback) -- never both.
#
# Why a GitHub App is preferred over a PAT:
#   * installation tokens are minted by ARC on demand and expire in <= 1 hour,
#     so a stolen pod/etcd dump yields a credential that dies quickly;
#   * the App is installed on THIS repository only, with the minimum permissions
#     (Administration: read & write -- required to mint runner registration
#     tokens -- plus Metadata: read; Actions: read for org/enterprise scale sets);
#   * a PAT carries the full rights of the human who created it across every repo
#     they can reach, and typically has no expiry;
#   * the App's private key can be rotated in the GitHub UI without touching any
#     user account.
#
# Only the ARC *controller/listener* in arc-systems reads this Secret. It is never
# mounted into a runner pod: the listener exchanges it for a short-lived JIT
# runner config per job (see README.md, "No long-lived .credentials").
#
# ---------------------------------------------------------------------------
# Option A -- SOPS + age (recommended; no extra controller to run)
#
#   1. age-keygen -o age.agekey                      # keep the private key OFFLINE
#   2. add .sops.yaml at the repo root:
#        creation_rules:
#          - path_regex: .*\.sops\.yaml$
#            encrypted_regex: ^(data|stringData)$
#            age: age1....                           # the PUBLIC key
#   3. kubectl -n flux-system create secret generic sops-age \
#        --from-file=age.agekey=age.agekey           # one-time, out of band
#   4. uncomment the `decryption:` block on Kustomization/infra-controllers and
#      Kustomization/infra-configs in clusters/homelab/infrastructure.yaml
#   5. cp github-app-secret.stub.yaml github-app-secret.sops.yaml
#      # fill in the real values, then:
#      sops --encrypt --in-place github-app-secret.sops.yaml
#   6. add `- github-app-secret.sops.yaml` to kustomization.yaml
#
# Option B -- sealed-secrets (bitnami-labs HelmRepository already exists)
#
#   1. add a sealed-secrets HelmRelease under infrastructure/controllers/
#   2. kubeseal --format yaml --namespace arc-runners --name arc-github-app \
#        < github-app-secret.stub.yaml > github-app-sealedsecret.yaml
#   3. add `- github-app-sealedsecret.yaml` to kustomization.yaml
#
# Until one of the two is in place, create the Secret out of band so the
# HelmRelease can become Ready (GitOps escape hatch, documented in README.md):
#
#   kubectl -n arc-runners create secret generic arc-github-app \
#     --from-literal=github_app_id=123456 \
#     --from-literal=github_app_installation_id=7654321 \
#     --from-file=github_app_private_key=app.private-key.pem
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Secret
metadata:
  name: arc-github-app
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: homelab
type: Opaque
stringData:
  # NOTE: IDs must be quoted strings.
  github_app_id: "REPLACE_ME_APP_ID"
  github_app_installation_id: "REPLACE_ME_INSTALLATION_ID"
  github_app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME_WITH_THE_GITHUB_APP_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----
  # PAT fallback -- mutually exclusive with the three keys above.
  # github_token: "REPLACE_ME_PAT"
