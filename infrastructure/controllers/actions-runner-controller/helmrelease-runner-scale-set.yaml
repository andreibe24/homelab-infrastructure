# Runner scale set "homelab-runners" -- the pool that `runs-on: [self-hosted, homelab-runners]`
# in .github/workflows/*.yaml resolves to.
#
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
# It renders an AutoscalingRunnerSet CR, so it MUST be applied after the controller
# HelmRelease above (hence `dependsOn`).
#
# Scope decision: githubConfigUrl points at a single REPOSITORY, not the org. A
# repo-scoped scale set cannot be targeted by workflows of any other repository,
# which keeps the blast radius of a compromised runner to this repo only
# (see README.md, "Threat model").
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-runners
  namespace: arc-runners
spec:
  interval: 1h
  # The release name must stay "homelab-runners": every derived object name
  # (ServiceAccount `homelab-runners-gha-rs-kube-mode`, Role, listener) is built
  # from it, and infrastructure/configs/actions-runner-controller/rbac.yaml binds
  # that exact ServiceAccount.
  releaseName: homelab-runners
  dependsOn:
    - name: arc
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      # Keep in lockstep with the controller chart version above.
      # renovate: datasource=docker registryUrl=oci://ghcr.io/actions/actions-runner-controller-charts
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Repository-scoped (NOT org-scoped, NOT enterprise-scoped).
    githubConfigUrl: https://github.com/andreibe24/homelab-infrastructure

    # Pre-existing Secret in namespace arc-runners holding EITHER
    #   github_app_id / github_app_installation_id / github_app_private_key  (preferred)
    # OR
    #   github_token  (classic PAT -- fallback only).
    # It is NOT rendered by this chart: see github-app-secret.stub.yaml and encrypt
    # the real values with SOPS/sealed-secrets before committing them.
    githubConfigSecret: arc-github-app

    runnerScaleSetName: homelab-runners
    runnerGroup: default

    # Multi-label support (chart >= 0.12). Without it a scale set is addressable
    # only by its exact name; with it, workflows can keep the familiar
    #   runs-on: [self-hosted, homelab-runners]
    # A job matches when its `runs-on` labels are a subset of this list.
    scaleSetLabels:
      - self-hosted
      - homelab-runners
      - linux
      - x64

    # minRunners: 0 -> nothing is running (and nothing holds credentials) while the
    # queue is empty. Each accepted job gets a brand-new pod that is destroyed when
    # the job ends: --ephemeral, one job per runner, no reuse.
    minRunners: 0
    maxRunners: 3

    # Explicit, so the chart does not have to `lookup` the controller Deployment
    # in the live cluster at render time.
    controllerServiceAccount:
      name: arc-gha-rs-controller
      namespace: arc-systems

    # Kubernetes container mode: the runner uses the container hooks to launch
    # `container:`/`services:` job pods as *sibling pods* via the Kubernetes API,
    # instead of a privileged Docker-in-Docker daemon. Rationale in README.md.
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - ReadWriteOnce
        # TODO(cluster): match your default provisioner (local-path for k3s,
        # openebs-hostpath, longhorn, ...).
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

    template:
      spec:
        securityContext:
          # uid/gid of the `runner` user in ghcr.io/actions/actions-runner.
          fsGroup: 1001
        containers:
          - name: runner
            # Pinned runner image; Renovate/ARC releases keep it current.
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["/home/runner/run.sh"]
            env:
              # Allow steps to run directly in this pod (needed so that build jobs
              # can reach the buildkitd sidecar over localhost). Jobs that DO set
              # `container:` still get an isolated hook-managed pod.
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              # docker/setup-buildx-action --driver remote + docker buildx use this.
              - name: BUILDKIT_HOST
                value: tcp://127.0.0.1:1234
              # buildx/regctl write credentials here (tmpfs-backed emptyDir that
              # dies with the pod).
              - name: DOCKER_CONFIG
                value: /home/runner/.docker
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 1001
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: docker-config
                mountPath: /home/runner/.docker

          # Rootless BuildKit sidecar: no privileged container, no docker socket,
          # no daemon shared between jobs -- it lives and dies with the ephemeral
          # runner pod. Multi-arch emulation comes from the binfmt DaemonSet in
          # infrastructure/configs/actions-runner-controller/binfmt-daemonset.yaml.
          - name: buildkitd
            image: moby/buildkit:v0.33.0-rootless
            args:
              - --addr
              - tcp://0.0.0.0:1234
              - --oci-worker-no-process-sandbox
              - --root
              - /home/user/.local/share/buildkit
            env:
              - name: BUILDKITD_FLAGS
                value: --oci-worker-no-process-sandbox
              # Used by the `buildctl` probes below: the daemon listens on TCP
              # only, so the client must not fall back to the default socket.
              - name: BUILDKIT_HOST
                value: tcp://127.0.0.1:1234
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 1000
              runAsGroup: 1000
              # Rootless buildkitd creates nested user namespaces; the default
              # seccomp/AppArmor profiles block that. It still runs as a normal
              # unprivileged user -- this is NOT `privileged: true`.
              seccompProfile:
                type: Unconfined
              appArmorProfile:
                type: Unconfined
            readinessProbe:
              exec:
                command: ["buildctl", "debug", "workers"]
              initialDelaySeconds: 5
              periodSeconds: 30
            livenessProbe:
              exec:
                command: ["buildctl", "debug", "workers"]
              initialDelaySeconds: 15
              periodSeconds: 30
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            volumeMounts:
              - name: buildkitd-state
                mountPath: /home/user/.local/share/buildkit
        volumes:
          # Local layer cache is intentionally ephemeral; cross-job caching is done
          # through the registry (`cache-from/cache-to: type=registry` in
          # .github/workflows/build-images.yaml), which survives pod deletion
          # without keeping any state on the node.
          - name: buildkitd-state
            emptyDir: {}
          - name: docker-config
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
