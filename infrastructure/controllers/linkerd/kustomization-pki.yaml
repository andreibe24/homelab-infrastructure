# Bootstrap ordering fix — why this extra Flux Kustomization exists.
#
# The cluster's stage order is:
#   infra-namespaces -> infra-sources -> infra-controllers -> infra-configs
#
# `HelmRelease/linkerd-control-plane` (infra-controllers) needs the trust anchor
# Secret as a *Helm value*, and that Secret is produced by cert-manager
# `Certificate` objects, which are custom resources and therefore belong to
# infra-configs. Reconciling them in infra-configs would deadlock:
#
#   infra-configs waits for infra-controllers (dependsOn + wait: true)
#   infra-controllers waits for linkerd-control-plane to be Ready
#   linkerd-control-plane waits for a Secret that only infra-configs creates
#
# The cycle is broken by reconciling ONLY the Linkerd PKI in its own Flux
# Kustomization that runs *inside* the controllers stage. It is applied together
# with the cert-manager HelmRelease and simply retries every `retryInterval`
# until the cert-manager CRDs and webhook are up — after which the anchor and
# the identity issuer are issued and the control plane converges.
#
# Consequences:
#   * `infrastructure/configs/linkerd/pki/` is owned exclusively by THIS
#     Kustomization; `infrastructure/configs/linkerd/kustomization.yaml` must
#     never list `pki` as a resource, or the two would fight over ownership.
#   * `wait: true` here means infra-controllers (and therefore infra-configs and
#     apps) only proceeds once the mesh PKI is actually issued.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkerd-pki
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/configs/linkerd/pki
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: linkerd-trust-anchor
      namespace: linkerd
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: linkerd-identity-issuer
      namespace: linkerd
