# TEMPLATE ONLY — NOT APPLIED BY FLUX.
#
# This file is deliberately absent from kustomization.yaml and contains no real
# credentials. It documents the two Secrets the observability stack expects in the
# `observability` namespace.
#
# Encrypt before committing, using the repo-wide mechanism topic 3 selects:
#
#   SOPS + age
#     cp secrets.example.yaml secrets.sops.yaml   # fill in the real values
#     sops --encrypt --in-place secrets.sops.yaml
#     # add `- secrets.sops.yaml` to kustomization.yaml, and make sure
#     # clusters/homelab/infrastructure.yaml sets decryption.secretRef on
#     # Kustomization/infra-controllers (and infra-configs for the webhook secret)
#
#   SealedSecrets
#     kubeseal --format yaml < secrets.plain.yaml > sealedsecret-observability.yaml
#     # add the SealedSecret to kustomization.yaml, delete the plaintext
#
# Quick manual bootstrap (fine for a first run, but NOT GitOps — Flux will not
# recreate it after a cluster rebuild):
#
#   kubectl -n observability create secret generic grafana-admin-credentials \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(head -c 24 /dev/urandom | base64)"
#
#   kubectl -n observability create secret generic alertmanager-webhooks \
#     --from-literal=slack-webhook-url='https://hooks.slack.com/services/XXX/YYY/ZZZ' \
#     --from-literal=generic-webhook-url='https://ntfy.example.com/homelab'
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: observability
type: Opaque
stringData:
  # Referenced by grafana.admin.{existingSecret,userKey,passwordKey} in
  # helmrelease-kube-prometheus-stack.yaml.
  admin-user: admin
  admin-password: REPLACE-ME-BEFORE-ENCRYPTING
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-webhooks
  namespace: observability
type: Opaque
stringData:
  # Referenced by the AlertmanagerConfig in
  # ../../configs/observability/alertmanager-config.yaml.
  #
  # REPLACE WITH THE REAL WEBHOOK URL — DO NOT COMMIT IT IN PLAIN TEXT.
  # A Slack incoming webhook URL is itself the credential: anyone who has it can
  # post to the channel. Same for most ntfy/Gotify endpoints.
  slack-webhook-url: https://hooks.slack.com/services/REPLACE/WITH/REAL-WEBHOOK
  generic-webhook-url: https://ntfy.example.invalid/homelab-alerts
