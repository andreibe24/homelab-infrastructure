apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Topic 6 -- renovate.
#
# Renovate is a plain CronJob, not a controller with CRDs, so everything lives in
# this single stage (infra-controllers) and nothing is needed under
# infrastructure/configs/ -- there are no custom resources to apply after a
# controller becomes Ready.
resources:
  - rbac.yaml
  - cronjob.yaml
  # - secret.sops.yaml   # uncomment once created from secret.sops.yaml.example
  #                      # and encrypted with the repo-wide secret mechanism
  #                      # (topic 3). Requires decryption.secretRef on
  #                      # Kustomization/infra-controllers.
