# RBAC for the Renovate CronJob.
#
# DELIBERATELY MINIMAL: Renovate is an outbound-only workload. It clones this
# repository over HTTPS, queries public package registries and calls the GitHub
# API. It does not read Secrets, list Pods or create anything in the cluster, so
# it needs NO Role, NO RoleBinding and NO ClusterRole -- this file intentionally
# contains only a ServiceAccount.
#
# The default ServiceAccount of the namespace would technically work too, but a
# dedicated one gives the workload its own identity for audit logs, NetworkPolicy
# selectors and future PodSecurity/admission rules, at zero privilege cost.
#
# The pod additionally sets `automountServiceAccountToken: false`, so no API
# token is projected into the container at all: even if the Renovate process were
# compromised, it holds no Kubernetes credentials -- only the GitHub PAT, which
# is itself scoped to this single repository.
#
# If a Kubernetes-aware datasource is ever added (e.g. reading cluster state to
# decide on updates), add a Role here with the narrowest possible verbs and flip
# `automountServiceAccountToken` back to true in cronjob.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
