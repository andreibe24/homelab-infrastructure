---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cilium # namespace omitted: defaults to the HelmRelease's own
  # cilium operator updates the crds once new ones are available
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: false # never auto-uninstall/rollback the CNI
  valuesFrom:
    - kind: ConfigMap
      name: cilium-custom-helmvalues
