---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
configMapGenerator:
  - name: cilium-custom-helmvalues
    files:
      - values.yaml=custom.helmvalues.yaml # key=file
  - name: cilium-cluster-helmvalues
    files:
      - dev.yaml=custom-values/dev.yaml
      - homelab.yaml=custom-values/homelab.yaml
generatorOptions:
  disableNameSuffixHash: true # keeps the name stable for valuesFrom
resources:
  - cilium.ocirepository.yaml
  - cilium.helmrelease.yaml
  - cilium.networkpolicy.yaml
