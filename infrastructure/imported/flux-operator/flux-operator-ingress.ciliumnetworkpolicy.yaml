---
# Allows traffic from Cilium Gateway API (Envoy proxy).
# Standard K8s NetworkPolicy namespaceSelector: {} does not match Cilium's
# internal 'reserved:ingress' entity, causing connection timeouts without this.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9080"
              protocol: TCP
