---
# Allows traffic from Cilium Gateway API (known as 'reserved:ingress').
# flux-operator-web's (NetworkPolicy) "ingress.from.namespaceSelector:{}" blocks external access.
# Therefore, it doesn't match Cilium's internal 'reserved:ingress' identity, 
# causing connection timeouts without this.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEntities: # only reserved cilium ids are supported entities. More identities here: https://docs.cilium.io/en/stable/gettingstarted/terminology/#special-identities
        - ingress
      toPorts:
        - ports:
            - port: "9080"
              protocol: TCP
