---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-operator # namespace omitted: defaults to the HelmRelease's own
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: false # never auto-uninstall/rollback the CNI
  valuesFrom:
    - kind: ConfigMap
      name: flux-operator-custom-helmvalues
