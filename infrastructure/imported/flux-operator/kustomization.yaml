---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
configMapGenerator:
  - name: flux-operator-custom-helmvalues
    files:
      - values.yaml=custom.helmvalues.yaml # key=file
generatorOptions:
  disableNameSuffixHash: true # keeps the name stable for valuesFrom
resources:
  - flux-operator.ocirepository.yaml
  - flux-operator.helmrelease.yaml
  - flux-viewers.clusterrolebinding.yaml
