apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - ../../../cilium
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: cilium
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: cilium-cluster-helmvalues
          valuesKey: dev.yaml
