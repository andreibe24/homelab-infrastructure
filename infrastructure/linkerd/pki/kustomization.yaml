apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Linkerd — pki stage.
#
# The `linkerd` Namespace plus the trust anchor and identity issuer
# Issuer/Certificate objects. Reconciled by Kustomization/linkerd-pki, which
# dependsOn cert-manager-release (wait: true) so cert-manager's CRDs and
# webhook already exist, and MUST reconcile (and reach Ready — i.e. the
# Certificates issued, the Secrets populated) BEFORE ../release/, because
# HelmRelease/linkerd-control-plane in ../release/ consumes the resulting
# `linkerd-trust-anchor` Secret as a Helm value (`valuesFrom`).
resources:
  - namespace.yaml
  - trust-anchor.yaml
  - identity-issuer.yaml
