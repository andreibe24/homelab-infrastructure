# The `linkerd` Namespace travels with the pki stage because it must exist
# before the trust-anchor/identity-issuer Certificates below can be created.
---
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd
  labels:
    app.kubernetes.io/part-of: homelab
    # Required by the Linkerd control plane charts.
    linkerd.io/is-control-plane: "true"
    config.linkerd.io/admission-webhooks: disabled
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    linkerd.io/inject: disabled
