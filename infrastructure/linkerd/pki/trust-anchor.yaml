# Linkerd trust anchor — the root of the mesh's PKI.
#
# Owned by Kustomization/linkerd-pki (clusters/homelab/infrastructure.yaml),
# reconciled BEFORE ../release/ (which dependsOn this stage with wait: true):
# the control-plane HelmRelease in ../release/ consumes the resulting Secret as
# a Helm value, so it must already exist by the time that HelmRelease is applied.
#
# Everything Linkerd's PKI touches must be ECDSA P-256 — RSA anchors/issuers are
# rejected by the identity controller.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: linkerd-selfsigned-issuer
  namespace: linkerd
  labels:
    app.kubernetes.io/part-of: linkerd
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
  labels:
    app.kubernetes.io/part-of: linkerd
spec:
  secretName: linkerd-trust-anchor
  isCA: true
  commonName: root.linkerd.cluster.local
  # 10 years. The anchor's *public* half is baked into every proxy's trust
  # bundle, so rotating it is a two-step, restart-everything operation
  # (https://linkerd.io/2/tasks/manually-rotating-control-plane-tls-credentials/).
  duration: 87600h
  renewBefore: 8760h # 1 year of warning before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    # Never rotate the key silently: a new anchor key means a new trust bundle
    # and a rolling restart of every meshed pod. Do it deliberately.
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
    - digital signature
  issuerRef:
    name: linkerd-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
