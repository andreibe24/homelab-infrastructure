apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Linkerd — policy stage.
#
# Mesh policy CRs (MeshTLSAuthentication, NetworkAuthentication, and the
# commented-out Server/AuthorizationPolicy pair). These need the Linkerd CRDs
# installed by linkerd-crds/linkerd-control-plane, so this stage is reconciled
# by Kustomization/linkerd-policy, which dependsOn linkerd-release (wait: true).
resources:
  - authorization-policies.yaml
