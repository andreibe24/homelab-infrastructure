# Helm chart source for the Linkerd stable channel. Owned by this component
# instead of a shared cross-cutting sources file.
#
# If the edge channel is chosen instead, change the URL to
# https://helm.linkerd.io/edge and record the decision in ../README.md.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: linkerd
  namespace: flux-system
spec:
  interval: 12h
  url: https://helm.linkerd.io/stable
