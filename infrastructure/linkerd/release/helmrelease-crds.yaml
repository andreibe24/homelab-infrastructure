# Linkerd CRDs (Server, AuthorizationPolicy, MeshTLSAuthentication,
# ServiceProfile, HTTPRoute, ...). Kept as a separate release so that the
# control plane can declare it in `dependsOn` and so that `prune`/`uninstall` of
# the control plane never removes the CRDs.
#
# Chart 1.8.0 is the last chart of the free `stable` channel and pairs with
# linkerd-control-plane 1.16.11 (stable-2.14.10). Renovate (topic 6) keeps it
# pinned/updated; if the cluster ever moves to the edge channel, change the URL
# in ./helm-repository.yaml, not here.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-crds
  namespace: linkerd
spec:
  interval: 1h
  timeout: 5m
  releaseName: linkerd-crds
  chart:
    spec:
      chart: linkerd-crds
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: linkerd
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The Gateway API HTTPRoute CRD is shipped by the chart as well; leave it
    # enabled only if no other Gateway API implementation owns those CRDs.
    # Topic 4 (webapp) must not install a second copy.
    enableHttpRoutes: true
