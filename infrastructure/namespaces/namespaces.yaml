# Shared namespaces for every topic, owned by the cluster-bootstrap topic.
#
# Rationale: namespaces are created in one place (a single, early Flux
# Kustomization) so that HelmReleases, secrets and CRs owned by different topic
# agents never race each other to create the same namespace, and so `prune: true`
# semantics stay predictable.
#
# Per-topic agents: do NOT create Namespace objects in your own directory.
# If you need a label/annotation on one of these (e.g. `linkerd.io/inject: enabled`),
# add it here in the same PR/commit as your topic.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd
  labels:
    app.kubernetes.io/part-of: homelab
    # Required by the Linkerd control plane charts.
    linkerd.io/is-control-plane: "true"
    config.linkerd.io/admission-webhooks: disabled
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    linkerd.io/inject: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd-viz
  labels:
    app.kubernetes.io/part-of: homelab
    linkerd.io/extension: viz
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    app.kubernetes.io/part-of: homelab
    # actions-runner-controller (gha-runner-scale-set-controller) lives here.
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    app.kubernetes.io/part-of: homelab
    # Ephemeral runner pods + BuildKit/Kaniko builders land here.
    # Deliberately NOT mesh-injected: build pods are short-lived and churn a lot.
  annotations:
    linkerd.io/inject: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: renovate
  labels:
    app.kubernetes.io/part-of: homelab
  annotations:
    linkerd.io/inject: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: webapp
  labels:
    app.kubernetes.io/part-of: homelab
  annotations:
    # Automatic mTLS for the Django/Hypercorn backend and the nginx frontend.
    linkerd.io/inject: enabled
