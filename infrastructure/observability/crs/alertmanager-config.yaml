# Alert routing — CRD-based (`AlertmanagerConfig`) rather than a hand-maintained
# alertmanager.yaml Secret, so routes are plain Kubernetes objects that Flux can
# reconcile and diff.
#
# How it plugs together:
#   1. The chart's Alertmanager CR selects every AlertmanagerConfig in the
#      `observability` namespace (`alertmanagerConfigSelector: {}`).
#   2. `alertmanagerConfigMatcherStrategy.type: None` is set in the HelmRelease, so
#      the operator does NOT inject a `namespace="observability"` matcher — alerts
#      about workloads in webapp / renovate / arc-* / kube-system route correctly.
#   3. The operator merges this into the top-level config; route names are
#      namespaced by the operator (they appear as
#      `observability/homelab-alerts/<receiver>` in the Alertmanager UI).
#
# ############################################################################
# #  SECRETS — DO NOT COMMIT WEBHOOK URLS                                     #
# #  Both receivers below read their URL from a Secret in this namespace:     #
# #    Secret/alertmanager-webhooks                                           #
# #      slack-webhook-url:   https://hooks.slack.com/services/REPLACE/ME     #
# #      generic-webhook-url: https://ntfy.example.invalid/homelab            #
# #  A Slack incoming webhook URL is a bearer credential: anyone holding it   #
# #  can post as your bot. Create the Secret with the repo-wide mechanism     #
# #  chosen by topic 3 (SOPS-encrypted Secret or SealedSecret) — see          #
# #  ../../controllers/observability/README.md and                            #
# #  ../../controllers/observability/secrets.example.yaml.                    #
# #  Until it exists, Alertmanager logs a config-load error and keeps running #
# #  with the previous (default) configuration.                               #
# ############################################################################
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: homelab-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: observability
spec:
  route:
    receiver: slack-notifications
    groupBy: ["alertname", "namespace", "severity"]
    groupWait: 30s
    groupInterval: 5m
    # Homelab-friendly: re-nag every 12h instead of every 4h.
    repeatInterval: 12h
    # Route order matters: Alertmanager walks the children top-down and stops at
    # the first match unless `continue: true`. The critical route is therefore
    # first with continue=true (phone push), and every later route delivers to
    # chat exactly once — the last one is the catch-all, without which an alert
    # matched only by a `continue: true` route would never reach Slack.
    routes:
      # Watchdog fires continuously by design (dead-man's switch). Send it to the
      # generic webhook only — a healthchecks.io / ntfy endpoint that alarms when
      # it STOPS arriving is what actually proves the alerting path works.
      - receiver: generic-webhook
        matchers:
          - name: alertname
            value: Watchdog
        repeatInterval: 5m
        continue: false

      # Everything critical also hits the generic webhook (phone push), then keeps
      # travelling down to one of the chat routes below.
      - receiver: generic-webhook
        matchers:
          - name: severity
            value: critical
        repeatInterval: 1h
        continue: true

      # The todo.md use case: "k8s cronjob poller fails". Failed pollers are routed
      # on the `category` label the PrometheusRules attach, so new CronJob alerts
      # are picked up without touching this file. Grouped by the owning CronJob so
      # a flapping poller is one thread, not one message per Job object.
      - receiver: slack-notifications
        matchers:
          - name: category
            value: cronjob
        groupBy: ["alertname", "namespace", "owner_name"]
        groupWait: 10s
        repeatInterval: 6h
        continue: false

      # Informational alerts are grouped hard and rarely repeated.
      - receiver: slack-notifications
        matchers:
          - name: severity
            value: info
        groupInterval: 30m
        repeatInterval: 24h
        continue: false

      # Catch-all: warnings/criticals that matched none of the above.
      - receiver: slack-notifications
        continue: false

  inhibitRules:
    # A node in trouble makes every pod on it noisy: keep the node alert only.
    # `cluster` is the external label every series carries (set in the
    # HelmRelease), so this matches cluster-wide rather than per-node — workload
    # alerts do not carry a `node` label to join on.
    - sourceMatch:
        - name: severity
          value: critical
        - name: category
          value: node
      targetMatch:
        - name: category
          value: workload
      equal: ["cluster"]
    # NB: "critical inhibits warning/info for the same alertname+namespace" is
    # already part of the chart's base Alertmanager config, so it is not repeated
    # here.

  receivers:
    - name: slack-notifications
      slackConfigs:
        - channel: "#homelab-alerts"
          # REPLACE WITH A REAL WEBHOOK URL — stored in a Secret, never inline.
          apiURL:
            name: alertmanager-webhooks
            key: slack-webhook-url
          sendResolved: true
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})
          text: >-
            {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ if .Annotations.runbook_url }}<{{ .Annotations.runbook_url }}|runbook> {{ end }}
            {{ end }}

    - name: generic-webhook
      webhookConfigs:
        # Plain JSON POST — works with ntfy, Gotify, healthchecks.io, n8n, a small
        # self-written receiver, ... Same rule: URL comes from the Secret.
        - urlSecret:
            name: alertmanager-webhooks
            key: generic-webhook-url
          sendResolved: true
          maxAlerts: 10
