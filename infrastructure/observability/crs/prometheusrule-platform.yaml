# Platform-level alerts: workload restarts, node pressure and the Linkerd mesh.
#
# These deliberately overlap very little with the kubernetes-mixin rules the chart
# already installs (`defaultRules.create: true`); where they do (pod restarts), the
# thresholds here are homelab-friendly rather than SRE-strict.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-health
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: observability
spec:
  groups:
    # ------------------------------------------------------------- workloads ---
    - name: workload.rules
      interval: 1m
      rules:
        - alert: PodHighRestartCount
          expr: |
            increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[1h]) > 5
          for: 10m
          labels:
            severity: warning
            category: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in the last hour"
            description: >-
              Container {{ $labels.container }} keeps restarting. Check
              `kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}`
              for OOMKilled / probe failures.

        - alert: PodCrashLooping
          expr: |
            max by (namespace, pod, container) (
              kube_pod_container_status_waiting_reason{job="kube-state-metrics", reason="CrashLoopBackOff"}
            ) > 0
          for: 5m
          labels:
            severity: critical
            category: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff"
            description: "Container {{ $labels.container }} has been crash-looping for more than 5 minutes."

        - alert: PodOOMKilled
          expr: |
            increase(kube_pod_container_status_last_terminated_reason{job="kube-state-metrics", reason="OOMKilled"}[15m]) > 0
          labels:
            severity: warning
            category: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
            description: "Raise the memory limit for container {{ $labels.container }} or find the leak."

        - alert: DeploymentReplicasMismatch
          expr: |
            (
              kube_deployment_spec_replicas{job="kube-state-metrics"}
                != kube_deployment_status_replicas_available{job="kube-state-metrics"}
            )
            and changes(kube_deployment_status_replicas_updated{job="kube-state-metrics"}[10m]) == 0
          for: 15m
          labels:
            severity: warning
            category: workload
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
            description: "Desired and available replica counts have diverged for 15 minutes."

    # ----------------------------------------------------------------- nodes ---
    - name: node.rules
      interval: 1m
      rules:
        - alert: NodeMemoryPressure
          expr: |
            kube_node_status_condition{job="kube-state-metrics", condition="MemoryPressure", status="true"} == 1
          for: 5m
          labels:
            severity: critical
            category: node
          annotations:
            summary: "Node {{ $labels.node }} is under memory pressure"
            description: "The kubelet reports MemoryPressure=true; pod eviction is imminent or already happening."

        - alert: NodeDiskPressure
          expr: |
            kube_node_status_condition{job="kube-state-metrics", condition="DiskPressure", status="true"} == 1
          for: 5m
          labels:
            severity: critical
            category: node
          annotations:
            summary: "Node {{ $labels.node }} is under disk pressure"
            description: "The kubelet reports DiskPressure=true — images will be garbage collected and pods evicted."

        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true"} == 0
          for: 10m
          labels:
            severity: critical
            category: node
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: "Node has not been Ready for 10 minutes."

        - alert: NodeFilesystemAlmostOutOfSpace
          # node-exporter view, catches the "PVC/host disk slowly filling" case long
          # before the kubelet raises DiskPressure.
          expr: |
            (
              node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs"}
                / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs"}
            ) * 100 < 10
            and node_filesystem_readonly{job="node-exporter"} == 0
          for: 30m
          labels:
            severity: warning
            category: node
          annotations:
            summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% free"
            description: "Less than 10% free space left — Prometheus' own 20Gi PVC is a likely culprit."

        - alert: NodeMemoryAlmostExhausted
          expr: |
            (
              node_memory_MemAvailable_bytes{job="node-exporter"}
                / node_memory_MemTotal_bytes{job="node-exporter"}
            ) * 100 < 10
          for: 15m
          labels:
            severity: warning
            category: node
          annotations:
            summary: "Node {{ $labels.instance }} has {{ $value | printf \"%.1f\" }}% memory available"
            description: "Sustained low available memory; expect OOM kills."

    # --------------------------------------------------------------- linkerd ---
    # Requires topic 2 (linkerd) plus podmonitors.yaml in this directory. The `job`
    # label is `<podmonitor-namespace>/<podmonitor-name>`, i.e. `linkerd/linkerd-proxy`.
    - name: linkerd.rules
      interval: 1m
      rules:
        - alert: LinkerdProxyDown
          expr: up{job="linkerd/linkerd-proxy"} == 0
          for: 5m
          labels:
            severity: critical
            category: linkerd
          annotations:
            summary: "Linkerd proxy on {{ $labels.namespace }}/{{ $labels.pod }} is unreachable"
            description: >-
              The proxy admin endpoint (:4191) is not scrapable. If the proxy is
              really down the pod has lost mTLS and is very likely failing traffic.

        - alert: LinkerdControlPlaneDown
          expr: up{job="linkerd/linkerd-control-plane"} == 0
          for: 5m
          labels:
            severity: critical
            category: linkerd
          annotations:
            summary: "Linkerd control plane component {{ $labels.pod }} is down"
            description: >-
              destination/identity/proxy-injector outage: new pods will not get
              certificates and injection will silently stop.

        - alert: LinkerdUnmeshedTraffic
          # `tls="true"` is the proxy's own label for "this request was mTLS'd".
          # Anything else in a meshed namespace means traffic is in the clear.
          expr: |
            sum by (namespace, deployment) (
              rate(response_total{job="linkerd/linkerd-proxy", direction="inbound", tls!="true"}[10m])
            ) > 0
          for: 15m
          labels:
            severity: warning
            category: linkerd
          annotations:
            summary: "Unencrypted inbound traffic in {{ $labels.namespace }}"
            description: >-
              Inbound requests without mTLS identity. Expected for the webapp's
              QUIC/UDP port (Linkerd does not proxy UDP) and for ingress from
              outside the mesh — silence those specifically rather than the rule.

        - alert: LinkerdIdentityCertExpiringSoon
          expr: |
            (identity_cert_expiration_timestamp_seconds - time()) < 86400 * 7
          for: 10m
          labels:
            severity: warning
            category: linkerd
          annotations:
            summary: "Linkerd identity issuer certificate expires in {{ $value | humanizeDuration }}"
            description: >-
              cert-manager (topic 2) should rotate it automatically; if it does not,
              the whole mesh stops issuing workload certs when it expires.
