# kube-prometheus-stack — the whole metrics/alerting/dashboard plane in one chart:
#   Prometheus Operator (+ CRDs) | Prometheus | Alertmanager | Grafana
#   kube-state-metrics | node-exporter | the standard kubernetes-mixin rules
#
# DECISION: Grafana is used *bundled* (grafana.enabled: true) rather than as a
# separate HelmRelease from HelmRepository/grafana. Reasons: the chart already wires
# the Prometheus datasource, the dashboard sidecar and the default k8s dashboards,
# and one release means one thing to upgrade. The `grafana` HelmRepository stays in
# ./helm-repositories.yaml for a future Loki/promtail/standalone-Grafana split.
#
# VERSION PINNING (Renovate, topic 6, keeps these current — the
# `# renovate: ...` style comments below are the hints it needs):
#   chart kube-prometheus-stack 91.1.0  -> prometheus-operator v0.94.0
#   subcharts: grafana 13.2.4 (Grafana 13.2.1), kube-state-metrics 8.4.2,
#              prometheus-node-exporter 4.57.0
#   images below are pinned explicitly so an image-level bump is a visible commit.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      # renovate: registryUrl=https://prometheus-community.github.io/helm-charts
      version: "91.1.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # The chart ships the Prometheus Operator CRDs as a subchart; CreateReplace
    # makes Flux apply CRD schema changes on upgrade instead of silently skipping.
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    # --------------------------------------------------------------- global ---
    fullnameOverride: kube-prometheus-stack
    crds:
      enabled: true

    # Homelab control planes (k3s/RKE2, or a managed distro) usually do not expose
    # etcd / controller-manager / scheduler / kube-proxy metrics endpoints on the
    # node IPs. Leaving these enabled produces permanently firing "target down"
    # alerts, so they are off. Flip to true (and add the right `--*-bind-address`
    # flags on the control plane) if you do expose them.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
      serviceMonitor:
        cAdvisor: true

    defaultRules:
      create: true
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    # ---------------------------------------------------- prometheus-operator ---
    prometheusOperator:
      enabled: true
      image:
        registry: quay.io
        repository: prometheus-operator/prometheus-operator
        # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-operator
        tag: v0.94.0
      prometheusConfigReloader:
        image:
          registry: quay.io
          repository: prometheus-operator/prometheus-config-reloader
          # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-config-reloader
          tag: v0.94.0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 384Mi

    # ---------------------------------------------------------- prometheus ---
    prometheus:
      enabled: true
      prometheusSpec:
        image:
          registry: quay.io
          repository: prometheus/prometheus
          # renovate: datasource=docker depName=quay.io/prometheus/prometheus
          tag: v3.14.0-distroless
        # Every cluster series carries this label, which keeps alerts readable once
        # a second cluster (clusters/<name>/) exists.
        externalLabels:
          cluster: homelab
        scrapeInterval: 30s
        evaluationInterval: 30s
        # Homelab sizing: 15 days at ~30s resolution fits comfortably in 20Gi.
        # retentionSize is deliberately below the PVC size so the TSDB prunes
        # itself before the volume fills up (a full PVC wedges Prometheus).
        retention: 15d
        retentionSize: 16GiB
        walCompression: true
        enableAdminAPI: false
        # THE contract with every other topic: an empty (nil) selector plus
        # NilUsesHelmValues=false means "discover ServiceMonitors / PodMonitors /
        # PrometheusRules / Probes / ScrapeConfigs in ALL namespaces, regardless of
        # labels". Topics 2/3/4/6 can therefore ship their own CRs without knowing
        # anything about this release name.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        probeSelectorNilUsesHelmValues: false
        probeSelector: {}
        probeNamespaceSelector: {}
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeConfigSelector: {}
        scrapeConfigNamespaceSelector: {}
        # Linkerd (topic 2): Prometheus scrapes pods directly by pod IP on many
        # different ports, including the proxy admin port 4191 which is NOT part of
        # the mesh. Keeping the Prometheus pod itself out of the mesh avoids the
        # sidecar interfering with those scrapes; Grafana and Alertmanager below
        # stay meshed via the namespace-level annotation set in
        # ./namespace.yaml.
        podMetadata:
          annotations:
            linkerd.io/inject: disabled
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              # Uncomment and set for your cluster (k3s: local-path,
              # Longhorn: longhorn, ...). Unset = the cluster default class.
              # storageClassName: local-path
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 2Gi
      service:
        type: ClusterIP

    # -------------------------------------------------------- alertmanager ---
    alertmanager:
      enabled: true
      alertmanagerSpec:
        image:
          registry: quay.io
          repository: prometheus/alertmanager
          # renovate: datasource=docker depName=quay.io/prometheus/alertmanager
          tag: v0.34.0
        retention: 120h
        # Empty selector = pick up every AlertmanagerConfig in the observability
        # namespace (ours lives in ../crs/).
        alertmanagerConfigSelector: {}
        # MUST be `None`. The operator's default (OnNamespace) silently appends a
        # `namespace="observability"` matcher to every route coming from an
        # AlertmanagerConfig, which would drop alerts fired for workloads in
        # webapp / renovate / arc-runners / kube-system.
        alertmanagerConfigMatcherStrategy:
          type: None
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              # storageClassName: local-path
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      # Minimal top-level config only: the real routing/receivers live in the
      # AlertmanagerConfig CR in ../crs/.
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          # Fallback only. The operator appends every AlertmanagerConfig CR as a
          # child route of this one, and the CR in
          # ../crs/alertmanager-config.yaml has no
          # top-level matchers, so it catches everything before this receiver is
          # reached. Deliberately NO `Watchdog -> null` child route here: child
          # routes defined in this base config are evaluated *before* the CR's,
          # which would swallow the dead-man's-switch alert the CR forwards to the
          # generic webhook on purpose.
          receiver: "null"
          # Explicitly empty: the chart's default value for this key contains a
          # `Watchdog -> null` child route, and Helm merges maps but keeps
          # sub-lists it is not given. Leaving it out would therefore silently
          # swallow the dead-man's-switch alert that the AlertmanagerConfig
          # forwards to the generic webhook on purpose.
          routes: []
        receivers:
          - name: "null"
      service:
        type: ClusterIP

    # ------------------------------------------------------------- grafana ---
    grafana:
      enabled: true
      # renovate: datasource=docker depName=docker.io/grafana/grafana
      image:
        tag: "13.2.1"
      # NO PLAINTEXT CREDENTIALS. The admin user/password come from a Secret that
      # is NOT in this repo in clear text — create it with the repo-wide secret
      # mechanism chosen by topic 3 (SOPS-encrypted Secret or SealedSecret), see
      # ../README.md and ../secrets.example.yaml.
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: browser
      # Dashboard sidecar: any ConfigMap labelled `grafana_dashboard: "1"` in any
      # namespace is imported automatically (see the Cluster Overview dashboard in
      # ../crs/).
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
        datasources:
          enabled: true
          searchNamespace: ALL
      persistence:
        enabled: true
        type: pvc
        accessModes: ["ReadWriteOnce"]
        # storageClassName: local-path
        size: 5Gi
      grafana.ini:
        server:
          # Set to the external URL if topic 4 fronts Grafana with an
          # Ingress/HTTPRoute; harmless for pure port-forward access.
          root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
        analytics:
          check_for_updates: false
          reporting_enabled: false
        users:
          viewers_can_edit: false
      # Exposure: ClusterIP + `kubectl port-forward` by default (README). Enable
      # this (or an HTTPRoute owned by topic 4) to publish it.
      ingress:
        enabled: false
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 512Mi

    # ------------------------------------------------- exporters / metrics ---
    kube-state-metrics:
      # kube_job_status_failed / kube_cronjob_* come from here: they are what the
      # "CronJob poller failed" alerts in configs/observability/ are built on.
      metricLabelsAllowlist:
        - cronjobs=[*]
        - jobs=[*]
        - pods=[app.kubernetes.io/name,app.kubernetes.io/instance]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
