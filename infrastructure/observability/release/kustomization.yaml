apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# observability — release stage.
#
# Namespace + Helm sources + the kube-prometheus-stack HelmRelease. Reconciled
# by Kustomization/observability-release. `../crs/` depends on this stage
# (dependsOn + wait: true) because ServiceMonitor/PodMonitor/PrometheusRule/
# AlertmanagerConfig need the Prometheus Operator CRDs bundled in this chart.
resources:
  - namespace.yaml
  - helm-repositories.yaml
  - helmrelease-kube-prometheus-stack.yaml
# ../secrets.example.yaml is a template only — it is NOT listed above on purpose.
# Copy it, fill it in, encrypt it (SOPS/SealedSecrets, topic 3's choice) and add
# the encrypted file to this list.
