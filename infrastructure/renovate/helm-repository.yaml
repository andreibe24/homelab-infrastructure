# Helm chart source for this component. Owned here instead of a shared
# cross-cutting sources file. Currently unused: the CronJob below is a
# hand-written manifest, not a Helm install (see ./README.md). Kept
# pre-declared in case the chart is adopted instead.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 12h
  url: https://docs.renovatebot.com/helm-charts
