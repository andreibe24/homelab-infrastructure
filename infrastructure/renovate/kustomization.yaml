apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# renovate — single stage.
#
# Renovate is a plain CronJob, not a controller with CRDs, so its Namespace,
# Helm source, ServiceAccount and CronJob all ship in one apply — there are no
# custom resources that must wait for a controller to become Ready.
resources:
  - namespace.yaml
  - helm-repository.yaml
  - rbac.yaml
  - cronjob.yaml
  # - secret.sops.yaml   # uncomment once created from secret.sops.yaml.example
  #                      # and encrypted with the repo-wide secret mechanism
  #                      # (topic 3). Requires decryption.secretRef on
  #                      # Kustomization/renovate.
