# Shared Helm chart sources, owned by the cluster-bootstrap topic.
#
# All HelmRepository objects live in flux-system so a single copy is shared by
# every topic; HelmReleases reference them cross-namespace via
#   spec.chart.spec.sourceRef: {kind: HelmRepository, name: <name>, namespace: flux-system}
#
# Per-topic agents: if you need a chart repo that is not listed here, add the
# HelmRepository to THIS file (keep the list alphabetical) instead of creating a
# private one inside your topic directory.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami-labs
  namespace: flux-system
spec:
  interval: 12h
  url: https://bitnami-labs.github.io/sealed-secrets
  # sealed-secrets controller (topic 3, if SealedSecrets is chosen over SOPS)
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 12h
  url: https://grafana.github.io/helm-charts
  # grafana, loki, promtail (topic 5)
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 12h
  url: https://kubernetes.github.io/ingress-nginx
  # Optional north-south ingress (topic 4). Note: for HTTP/3 over UDP the webapp
  # topic may prefer a Gateway API implementation or a plain LoadBalancer/NodePort
  # UDP Service instead -- see apps/base/webapp/PLAN.md.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.jetstack.io
  # cert-manager (topic 2: Linkerd trust anchor + identity issuer; topic 4: TLS certs)
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: linkerd
  namespace: flux-system
spec:
  interval: 12h
  url: https://helm.linkerd.io/stable
  # linkerd-crds, linkerd-control-plane, linkerd-viz (topic 2)
  # If the edge channel is chosen instead, change the URL to
  # https://helm.linkerd.io/edge and record the decision in the topic PLAN.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
  # kube-prometheus-stack (topic 5)
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 12h
  url: https://docs.renovatebot.com/helm-charts
  # renovate chart (topic 6), used if the CronJob is installed via Helm rather
  # than as a hand-written CronJob manifest.
